<template>
    <div class="row">
        <template lwc:if={edited}>
            <span class="dot" title="Customized"></span>
        </template>
        <label class="label" for="picker">{label}</label>
        <span class="hex">{value}</span>
        <input
            id="picker"
            class="picker"
            type="color"
            value={value}
            disabled={disabled}
            aria-label={pickerAria}
            oninput={handleInput}
        />
    </div>
    <template lwc:if={hasPresets}>
        <div
            class="swatches"
            role="radiogroup"
            aria-label={presetGroupLabel}
            onkeydown={handleSwatchKeydown}
        >
            <template for:each={swatches} for:item="s">
                <button
                    key={s.key}
                    type="button"
                    class={s.cls}
                    role="radio"
                    aria-checked={s.ariaChecked}
                    aria-disabled={s.ariaDisabled}
                    aria-label={s.name}
                    aria-describedby={s.reasonId}
                    title={s.title}
                    tabindex={s.tabindex}
                    data-key={s.key}
                    onclick={handleSwatchClick}
                    onfocus={handleSwatchFocus}
                    onblur={handleSwatchBlur}
                >
                    <span class="chip" style={s.chipStyle}></span>
                </button>
                <span key={s.reasonKey} id={s.reasonId} class="sr-only"
                    >{s.reason}</span
                >
            </template>
        </div>
        <template lwc:if={noteText}>
            <p class="swatch-note" aria-live="polite">{noteText}</p>
        </template>
    </template>
    <template lwc:if={showBadge}>
        <div class="badge-row">
            <span class={badgeClass} role="status">{badgeLabel}</span>
            <template lwc:if={badgeHint}>
                <span class="hint">{badgeHint}</span>
            </template>
        </div>
    </template>
</template>
