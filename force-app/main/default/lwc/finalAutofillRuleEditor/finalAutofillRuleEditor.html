<template>
    <div class="am">
        <template lwc:if={showIntro}>
            <section class="am-intro" aria-label="How autofill works">
                <div class="am-intro-item">
                    <svg
                        class="am-intro-art"
                        viewBox="0 0 40 40"
                        aria-hidden="true"
                    >
                        <rect
                            class="am-art-paper"
                            x="4"
                            y="12"
                            width="32"
                            height="16"
                            rx="8"
                        ></rect>
                        <path class="am-art-accent" d="M14 20h12"></path>
                        <circle
                            class="am-art-dot"
                            cx="12"
                            cy="20"
                            r="3"
                        ></circle>
                    </svg>
                    <span class="am-intro-text">
                        <strong>Someone opens the form</strong>
                        <span>From a link, a lookup, or while signed in.</span>
                    </span>
                </div>
                <div class="am-intro-item">
                    <svg
                        class="am-intro-art"
                        viewBox="0 0 40 40"
                        aria-hidden="true"
                    >
                        <rect
                            class="am-art-paper"
                            x="8"
                            y="6"
                            width="24"
                            height="28"
                            rx="3"
                        ></rect>
                        <path
                            class="am-art-weak"
                            d="M13 13h14M13 19h10M13 25h12"
                        ></path>
                    </svg>
                    <span class="am-intro-text">
                        <strong>We read one record</strong>
                        <span
                            >Only the fields you list, with the right
                            access.</span
                        >
                    </span>
                </div>
                <div class="am-intro-item">
                    <svg
                        class="am-intro-art"
                        viewBox="0 0 40 40"
                        aria-hidden="true"
                    >
                        <rect
                            class="am-art-paper"
                            x="7"
                            y="5"
                            width="26"
                            height="30"
                            rx="3"
                        ></rect>
                        <path class="am-art-weak" d="M11 11h10M11 23h10"></path>
                        <rect
                            class="am-art-soft"
                            x="11"
                            y="15"
                            width="18"
                            height="4"
                            rx="1.5"
                        ></rect>
                        <rect
                            class="am-art-soft"
                            x="11"
                            y="27"
                            width="18"
                            height="4"
                            rx="1.5"
                        ></rect>
                    </svg>
                    <span class="am-intro-text">
                        <strong>Answers start filled in</strong>
                        <span>They can still change any of them.</span>
                    </span>
                </div>
                <lightning-button
                    class="am-intro-hide"
                    variant="base"
                    label="Hide"
                    aria-label="Hide how autofill works"
                    onclick={handleHideIntro}
                ></lightning-button>
            </section>
        </template>

        <div class="am-top">
            <lightning-input
                class="am-name"
                label="Rule name"
                placeholder="For example: Contact from the link"
                value={draft.name}
                onchange={handleName}
            ></lightning-input>
            <lightning-input
                class="am-enabled"
                type="toggle"
                label="On"
                message-toggle-active=""
                message-toggle-inactive=""
                checked={draft.enabled}
                onchange={handleEnabled}
            ></lightning-input>
        </div>

        <section class="am-section">
            <h2 class="am-heading">Fill from</h2>
            <p class="am-help">Where the record comes from.</p>
            <c-final-picture-choice
                class="am-source"
                data-group="source"
                label="Fill from"
                options={sourceOptions}
                value={sourceType}
                onchange={handleSource}
            ></c-final-picture-choice>
            <template lwc:if={linkDisabled}>
                <p class="am-hint">
                    Another link rule is on. A link carries one record, so turn
                    that rule off to use the link here.
                </p>
            </template>

            <template lwc:if={isLink}>
                <template lwc:if={isLinkLocked}>
                    <template lwc:if={surveyNotConnected}>
                        <p class="am-hint am-locked">
                            Connect this survey to an object first: a survey
                            link carries its connected record.
                        </p>
                    </template>
                    <template lwc:else>
                        <p class="am-hint am-locked">{lockedLinkText}</p>
                    </template>
                </template>
                <template lwc:else>
                    <div class="am-objrow">
                        <template lwc:if={hasSourceObject}>
                            <c-final-object-icon
                                object-api={sourceObject}
                            ></c-final-object-icon>
                        </template>
                        <c-final-object-picker
                            class="am-object"
                            label="Object in the link"
                            objects={objects}
                            value={draft.source.objectApiName}
                            onpick={handleObjectPick}
                        ></c-final-object-picker>
                    </div>
                </template>
            </template>
            <template lwc:if={isUser}>
                <p class="am-hint">
                    Fills from whoever is signed in: their own details (name,
                    email, phone…) and their Contact, Account or Manager. People
                    who aren’t signed in get nothing from this rule.
                </p>
            </template>
            <template lwc:if={isLookup}>
                <template lwc:if={hasLookups}>
                    <lightning-combobox
                        class="am-lookup"
                        label={lookupLabel}
                        options={lookupOptions}
                        value={draft.source.elementId}
                        onchange={handleLookupPick}
                    ></lightning-combobox>
                    <template lwc:if={isPolymorphicLookup}>
                        <lightning-combobox
                            class="am-poly"
                            label="Which object this rule reads"
                            options={polymorphicOptions}
                            value={draft.source.objectApiName}
                            onchange={handlePolymorphicPick}
                        ></lightning-combobox>
                    </template>
                    <p class="am-hint">
                        Only for people who are signed in: a lookup reads the
                        record they pick, with their own access.
                    </p>
                </template>
                <template lwc:else>
                    <p class="am-hint">{noLookupsHint}</p>
                </template>
            </template>
        </section>

        <section class="am-section">
            <h2 class="am-heading">What it fills</h2>
            <template lwc:if={hasSourceObject}>
                <p class="am-help">{fillsHelp}</p>
                <div class="am-grid" role="list">
                    <div class={headClass} aria-hidden="true">
                        <span>{fieldHeading}</span>
                        <span></span>
                        <span>Fills this answer</span>
                        <template lwc:if={showGuestColumn}>
                            <span class="am-center">Guests</span>
                        </template>
                        <span></span>
                    </div>
                    <template for:each={rows} for:item="r">
                        <div key={r.key} class={rowClass} role="listitem">
                            <div class="am-from">
                                <c-final-field-picker
                                    label={r.fieldLabel}
                                    variant="label-hidden"
                                    object-api={sourceObject}
                                    purpose="read"
                                    max-depth={maxDepth}
                                    allowed-relationships={allowedRelationships}
                                    allowed-types={allowedTypes}
                                    value={r.from}
                                    data-index={r.index}
                                    onfieldchange={handleFromPick}
                                ></c-final-field-picker>
                                <template lwc:if={r.from}>
                                    <span class="am-api">{r.from}</span>
                                </template>
                            </div>
                            <span class="am-arrow" aria-hidden="true">
                                <lightning-icon
                                    icon-name="utility:forward"
                                    size="xx-small"
                                ></lightning-icon>
                            </span>
                            <lightning-combobox
                                label={r.toLabel}
                                variant="label-hidden"
                                placeholder={choosePlaceholder}
                                options={r.options}
                                value={r.to}
                                data-index={r.index}
                                onchange={handleToPick}
                            ></lightning-combobox>
                            <template lwc:if={showGuestColumn}>
                                <lightning-input
                                    class="am-guest"
                                    type="checkbox"
                                    label={r.guestLabel}
                                    variant="label-hidden"
                                    checked={r.guestAllowed}
                                    data-index={r.index}
                                    onchange={handleGuest}
                                ></lightning-input>
                            </template>
                            <lightning-button-icon
                                icon-name="utility:close"
                                variant="bare"
                                alternative-text={r.removeLabel}
                                title={r.removeLabel}
                                data-index={r.index}
                                onclick={handleRemoveRow}
                            ></lightning-button-icon>
                            <template lwc:if={r.problem}>
                                <p class="am-row-problem">{r.problem}</p>
                            </template>
                            <template lwc:if={r.hasTest}>
                                <p class="am-row-test">{r.testText}</p>
                            </template>
                        </div>
                    </template>
                </div>
                <lightning-button
                    class="am-add"
                    variant="base"
                    label="Add a field"
                    icon-name="utility:add"
                    onclick={handleAddRow}
                ></lightning-button>
                <template lwc:if={guestNote}>
                    <div class="am-guest-summary">
                        <span>{guestLead}</span>
                        <template for:each={guestNames} for:item="g">
                            <span key={g.key} class="am-badge">{g.label}</span>
                        </template>
                    </div>
                </template>
            </template>
            <template lwc:else>
                <p class="am-hint">Choose where the values come from first.</p>
            </template>
        </section>

        <section class="am-section">
            <h2 class="am-heading">When someone has already typed an answer</h2>
            <p class="am-help">
                This matters when the record arrives after they started, like a
                lookup they pick halfway through.
            </p>
            <c-final-picture-choice
                class="am-policy"
                label="When someone has already typed an answer"
                options={policyOptions}
                value={draft.policy}
                onchange={handlePolicy}
            ></c-final-picture-choice>
        </section>

        <section class="am-section">
            <template lwc:if={isUser}>
                <h2 class="am-heading">Try it on yourself</h2>
                <p class="am-help">
                    Each row above shows what it would fill for you.
                </p>
                <div class="am-test">
                    <lightning-button
                        class="am-test-me"
                        label="Show what it fills for me"
                        disabled={testDisabled}
                        onclick={handleTest}
                    ></lightning-button>
                </div>
            </template>
            <template lwc:else>
                <h2 class="am-heading">Try it with a record</h2>
                <p class="am-help">
                    Paste the Id of a record you can see. Each row above shows
                    what it would fill.
                </p>
                <div class="am-test">
                    <lightning-input
                        class="am-test-id"
                        label="Record Id"
                        placeholder="A record you can see, e.g. 003…"
                        value={testRecordId}
                        onchange={handleTestId}
                    ></lightning-input>
                    <lightning-button
                        label="Show what it fills"
                        disabled={testDisabled}
                        onclick={handleTest}
                    ></lightning-button>
                </div>
            </template>
            <template lwc:if={testError}>
                <p class="am-row-problem" role="alert">{testError}</p>
            </template>
        </section>

        <div class="am-problems" role="status">
            <template lwc:if={hasShownProblems}>
                <template for:each={shownProblems} for:item="p">
                    <p key={p.key} class="am-row-problem">{p.text}</p>
                </template>
            </template>
        </div>
    </div>
</template>
