<template>
    <div class="re">
        <template lwc:if={hasRules}>
            <div class="re-top">
                <template lwc:if={isVisibility}>
                    <lightning-combobox
                        class="re-action"
                        label="Action"
                        options={actionOptions}
                        value={action}
                        onchange={handleAction}
                    ></lightning-combobox>
                </template>
                <lightning-combobox
                    class="re-logic"
                    label={logicLabel}
                    options={logicOptions}
                    value={logic}
                    onchange={handleLogic}
                ></lightning-combobox>
            </div>

            <template lwc:if={isCustomLogic}>
                <div class="re-custom-wrap" data-problem={logicProblem}>
                    <lightning-input
                        class="re-custom"
                        label="Custom logic"
                        placeholder="1 AND (2 OR 3)"
                        field-level-help="Refer to each condition by its number. Use AND, OR, NOT and brackets."
                        value={customLogic}
                        data-control="logic"
                        onchange={handleCustomLogic}
                        onblur={handleLogicBlur}
                    ></lightning-input>
                </div>
            </template>

            <div class={gridClass} role="list">
                <div class="re-row re-head" aria-hidden="true">
                    <span class="re-num"></span>
                    <template for:each={headers} for:item="h">
                        <span key={h.key} class="re-col">{h.label}</span>
                    </template>
                    <span></span>
                </div>

                <template for:each={rows} for:item="r">
                    <div key={r.key} class="re-row" role="listitem">
                        <span class="re-num">{r.number}</span>

                        <template lwc:if={isVisibility}>
                            <div class="re-cell">
                                <span class="re-cell-label" aria-hidden="true"
                                    >Source</span
                                >
                                <lightning-combobox
                                    label={r.kindLabel}
                                    variant="label-hidden"
                                    options={r.sourceKindOptions}
                                    value={r.kind}
                                    data-index={r.index}
                                    data-control="kind"
                                    onchange={handleSourceKind}
                                ></lightning-combobox>
                            </div>
                        </template>

                        <div class="re-cell" data-problem={r.fieldProblem}>
                            <span class="re-cell-label" aria-hidden="true"
                                >{fieldHeader}</span
                            >
                            <lightning-combobox
                                label={r.fieldLabel}
                                variant="label-hidden"
                                placeholder="Select field"
                                options={r.fieldOptions}
                                value={r.source}
                                data-index={r.index}
                                data-control="field"
                                onchange={handleRuleField}
                            ></lightning-combobox>
                        </div>

                        <div class="re-cell" data-problem={r.operatorProblem}>
                            <span class="re-cell-label" aria-hidden="true"
                                >Operator</span
                            >
                            <lightning-combobox
                                label={r.operatorLabel}
                                variant="label-hidden"
                                placeholder="Operator"
                                options={r.operatorOptions}
                                value={r.operator}
                                data-index={r.index}
                                data-control="operator"
                                onchange={handleRuleField}
                            ></lightning-combobox>
                        </div>

                        <div class="re-cell" data-problem={r.valueProblem}>
                            <template lwc:if={r.needsValue}>
                                <span class="re-cell-label" aria-hidden="true"
                                    >Value</span
                                >
                                <template lwc:if={r.isBool}>
                                    <lightning-combobox
                                        label={r.valueLabel}
                                        variant="label-hidden"
                                        placeholder="Choose Yes or No"
                                        options={r.boolOptions}
                                        value={r.value}
                                        data-index={r.index}
                                        data-control="value"
                                        onchange={handleRuleField}
                                    ></lightning-combobox>
                                </template>
                                <template lwc:elseif={r.isNumber}>
                                    <lightning-input
                                        type="number"
                                        label={r.valueLabel}
                                        variant="label-hidden"
                                        placeholder="Enter value"
                                        step="any"
                                        value={r.value}
                                        data-index={r.index}
                                        data-control="value"
                                        onchange={handleRuleField}
                                    ></lightning-input>
                                </template>
                                <template lwc:elseif={r.isDate}>
                                    <lightning-input
                                        type="date"
                                        label={r.valueLabel}
                                        variant="label-hidden"
                                        value={r.value}
                                        data-index={r.index}
                                        data-control="value"
                                        onchange={handleRuleField}
                                    ></lightning-input>
                                </template>
                                <template lwc:elseif={r.isDateTime}>
                                    <!-- Native on purpose: lightning-input's
                                         datetime stores an ISO timestamp,
                                         which would change what saved rules
                                         hold. It can't take a custom
                                         validity message, so its problem is
                                         the one written out as text. -->
                                    <input
                                        type="datetime-local"
                                        class="slds-input re-native"
                                        aria-label={r.valueLabel}
                                        aria-invalid={r.valueInvalid}
                                        value={r.value}
                                        data-index={r.index}
                                        data-control="value"
                                        onchange={handleRuleField}
                                    />
                                    <template lwc:if={r.valueProblem}>
                                        <p class="re-problem">
                                            {r.valueProblem}
                                        </p>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <lightning-input
                                        type="text"
                                        label={r.valueLabel}
                                        variant="label-hidden"
                                        placeholder="Enter value"
                                        value={r.value}
                                        data-index={r.index}
                                        data-control="value"
                                        onchange={handleRuleField}
                                    ></lightning-input>
                                </template>
                            </template>
                        </div>

                        <lightning-button-icon
                            class="re-del"
                            icon-name="utility:delete"
                            variant="bare"
                            alternative-text={r.removeLabel}
                            title={r.removeLabel}
                            data-index={r.index}
                            onclick={handleRemoveRule}
                        ></lightning-button-icon>
                    </div>
                </template>
            </div>

            <template lwc:if={hasLintWarnings}>
                <ul class="re-lint" role="status">
                    <template for:each={lintWarnings} for:item="p">
                        <li key={p}>{p}</li>
                    </template>
                </ul>
            </template>
            <template lwc:if={recordHint}>
                <p class="re-record-hint">{recordHint}</p>
            </template>
        </template>
        <template lwc:else>
            <p class="re-empty">{emptyHint}</p>
        </template>

        <lightning-button
            class="re-add"
            variant="base"
            label="Add condition"
            icon-name="utility:add"
            onclick={handleAddRule}
        ></lightning-button>
    </div>
</template>
