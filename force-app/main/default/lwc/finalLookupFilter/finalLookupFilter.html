<template>
    <div class="lf-root">
        <template lwc:if={loadError}>
            <div class="lf-error" role="alert">{loadError}</div>
        </template>

        <template lwc:if={showLookupControls}>
            <lightning-input
                label="Show in each result"
                field-level-help="The first field is the result's main line; a second becomes the smaller line under it."
                value={displayFieldsValue}
                placeholder="Name, Account.Name"
                onchange={handleDisplayFields}
            ></lightning-input>

            <lightning-input
                label="Search these fields"
                field-level-help="Leave empty to search whatever is shown in the result."
                value={searchFieldsValue}
                placeholder="Name"
                onchange={handleSearchFields}
            ></lightning-input>

            <p class="lf-hint" if:true={fieldHint}>{fieldHint}</p>

            <lightning-input
                type="checkbox"
                label="Let people filling this form anonymously search it"
                field-level-help="Off unless you mean it. Anyone with the link could look through these records."
                checked={allowGuest}
                onchange={handleGuestToggle}
            ></lightning-input>
        </template>

        <template lwc:if={filterOnly}>
            <!-- The mapping step has room: the conditions are edited right
                 here, and every change saves, like the rest of the step. -->
            <div class="lf-inline">
                <template lwc:if={allowTyped}>
                    <lightning-radio-group
                        class="lf-mode"
                        label="Write the conditions as"
                        variant="label-hidden"
                        type="button"
                        options={modeOptions}
                        value={modeValue}
                        onchange={handleMode}
                    ></lightning-radio-group>
                </template>
                <template lwc:if={loading}>
                    <p class="lf-hint lf-loading" role="status">
                        Loading fields…
                    </p>
                </template>
                <template lwc:elseif={onTyped}>
                    <c-final-mapping-soql
                        value={typedSoql}
                        questions={typedQuestions}
                        spec={typedSpec}
                        action-id={typedActionId}
                        onsoqlchange={handleSoql}
                    ></c-final-mapping-soql>
                </template>
                <template lwc:else>
                    <c-final-rule-editor
                        value={draft}
                        columns="mapping"
                        sources={sources}
                        noun="field"
                        extra-operators={extraOperators}
                        field-object={targetObject}
                        answer-choices={answerChoices}
                        onrulechange={handleInlineRule}
                    ></c-final-rule-editor>
                </template>
                <template lwc:if={otherModeNote}>
                    <p class="lf-hint lf-mode-note">{otherModeNote}</p>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="lf-conditions">
                <c-final-conditions-summary
                    value={ruleValue}
                    columns="lookup"
                    field-object={targetObject}
                    allow-current-user={allowCurrentUserCompare}
                    answer-choices={answerChoices}
                    sources={sources}
                    noun="field"
                    extra-operators={extraOperators}
                    label={dialogLabel}
                    description={dialogDescription}
                    disabled={loading}
                    onconditionschange={handleRuleChange}
                ></c-final-conditions-summary>
            </div>
        </template>
    </div>
</template>
