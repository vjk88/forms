<template>
    <div class="lookup-wrapper">
        <c-final-record-lookup
            data-id="core"
            object-api-name={targetObject}
            value={value}
            label={label}
            placeholder={placeholder}
            required={required}
            disabled={isLookupDisabled}
            pending={pending}
            unavailable-message={effectiveUnavailableMessage}
            filter={filter}
            matching-info={matchingInfo}
            display-info={displayInfo}
            context-key={contextKey}
            onselectionchange={handleSelectionChange}
            onlookuperror={handleLookupError}
        ></c-final-record-lookup>
    </div>
</template>
