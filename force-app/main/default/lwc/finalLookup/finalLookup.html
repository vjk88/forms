<template>
    <template lwc:if={isGuestUser}>
        <div class="lookup-guest-unavailable" role="status">
            <lightning-icon
                icon-name="utility:info"
                size="x-small"
                class="slds-m-right_x-small"
            ></lightning-icon>
            <span>{unavailableMessage}</span>
        </div>
    </template>
    <template lwc:else>
        <div class="lookup-wrapper">
            <lightning-record-picker
                data-id="picker"
                object-api-name={targetObject}
                value={value}
                label={label}
                placeholder={placeholder}
                required={required}
                disabled={isLookupDisabled}
                variant="label-hidden"
                onchange={handleChange}
                onerror={handleError}
            ></lightning-record-picker>
        </div>
    </template>
</template>
