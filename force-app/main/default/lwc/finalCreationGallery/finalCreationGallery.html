<template>
    <div class="gallery-root">
        <!-- ============== FORM TYPE (Screen 0): Form, Survey or Freeform ============== -->
        <template lwc:if={isTypeStep}>
            <header class="g-head">
                <div>
                    <h1 class="g-title">What are you creating?</h1>
                    <p class="g-sub">
                        Pick one. You can always create the other later.
                    </p>
                </div>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>
            <div class="type-grid">
                <button
                    class="type-card"
                    type="button"
                    onclick={handleTypeForm}
                >
                    <span class="type-icon">
                        <lightning-icon
                            icon-name="utility:form"
                            size="medium"
                        ></lightning-icon>
                    </span>
                    <span class="type-name">Form</span>
                    <span class="type-blurb">
                        Collects structured data into Salesforce records: every
                        answer becomes a field on the object you choose.
                    </span>
                    <span class="type-foot">Pick a layout and theme</span>
                </button>
                <button
                    class="type-card"
                    type="button"
                    onclick={handleTypeSurvey}
                >
                    <span class="type-icon">
                        <lightning-icon
                            icon-name="utility:feed"
                            size="medium"
                        ></lightning-icon>
                    </span>
                    <span class="type-name">Survey</span>
                    <span class="type-blurb">
                        Asks questions and measures sentiment. Answers land in
                        the answer store, ready for charts and topics. A
                        Salesforce object is optional.
                    </span>
                    <span class="type-foot">Pick a template and theme</span>
                </button>
                <button
                    class="type-card"
                    type="button"
                    onclick={handleTypeFreeform}
                >
                    <span class="type-icon">
                        <lightning-icon
                            icon-name="utility:edit_form"
                            size="medium"
                        ></lightning-icon>
                    </span>
                    <span class="type-name">Freeform</span>
                    <span class="type-blurb">
                        Ask anything you like. Answers are kept with the
                        submission, and you decide later which of them should
                        also write to Salesforce records.
                    </span>
                    <span class="type-foot">Pick a layout and theme</span>
                </button>
            </div>
        </template>

        <!-- ============================ GALLERY (Form path) ============================ -->
        <template lwc:elseif={isLayoutStep}>
            <header class="g-head">
                <div>
                    <lightning-button
                        class="d-back"
                        variant="base"
                        icon-name="utility:back"
                        label="Back"
                        onclick={handleBackFromLayout}
                    ></lightning-button>
                    <h1 class="g-title">Create a form</h1>
                    <p class="g-sub">
                        Pick a layout and make it your own. Form templates
                        arrive next.
                    </p>
                </div>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>

            <!-- Entry mode toggle. A freeform reached this screen from
                 its OWN template shelf, so offering 'Form templates' here
                 would send it back into the form path. -->
            <c-final-button-group
                lwc:if={showEntryToggle}
                class="entry-bar"
                label="How to start"
                options={entryOptions}
                value={entryValue}
                onchange={handleEntry}
            ></c-final-button-group>

            <!-- Mode A: form templates (placeholder — surveys moved to their
                 own path behind the type chooser, owner 2026-07-31) -->
            <div lwc:if={isTemplateMode} class="tpl-shelf">
                <section class="lg-group">
                    <div class="lg-head">
                        <h2 class="lg-title">Form templates</h2>
                        <span class="lg-hint"
                            >coming next; for now, start from a layout</span
                        >
                    </div>
                    <p class="lg-hint">
                        Looking for surveys? Go back and pick
                        <b>Survey</b> — templates and themes live there.
                    </p>
                </section>
            </div>

            <!-- Mode B: layouts, grouped -->
            <div lwc:else class="scratch">
                <template for:each={layoutGroups} for:item="grp">
                    <section key={grp.id} class="lg-group">
                        <div class="lg-head">
                            <h2 class="lg-title">{grp.title}</h2>
                            <span class="lg-hint">{grp.hint}</span>
                        </div>
                        <div class="card-grid">
                            <template for:each={grp.cards} for:item="l">
                                <c-final-layout-card
                                    key={l.key}
                                    layout={l.layout}
                                    pane-flow={l.paneFlow}
                                    theme-key={l.themeKey}
                                    label={l.name}
                                    description={l.description}
                                    full-bleed={l.fullBleed}
                                    max-width={l.maxWidth}
                                    selected={l.selected}
                                    onselect={handleLayoutSelect}
                                ></c-final-layout-card>
                            </template>
                        </div>
                    </section>
                </template>
            </div>
        </template>

        <!-- ============ SURVEY TEMPLATES (Survey path, screen 1) ============ -->
        <template lwc:elseif={isTemplatesStep}>
            <header class="d-head">
                <lightning-button
                    class="d-back"
                    variant="base"
                    icon-name="utility:back"
                    label="Back"
                    onclick={handleBackToType}
                ></lightning-button>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>

            <div class="thm-head">
                <h1 class="thm-title">{templatesTitle}</h1>
                <p class="thm-sub">{templatesSub}</p>
            </div>

            <section class="lg-group">
                <div class="tpl-grid">
                    <template for:each={templateCards} for:item="t">
                        <button
                            key={t.key}
                            type="button"
                            class={t.cls}
                            data-key={t.key}
                            onclick={handleTemplatePick}
                        >
                            <lightning-icon
                                icon-name={t.icon}
                                size="small"
                            ></lightning-icon>
                            <span class="tpl-name">{t.name}</span>
                            <span class="tpl-blurb">{t.blurb}</span>
                        </button>
                    </template>
                </div>
                <template lwc:if={errorMessage}>
                    <p class="g-error" role="alert">{errorMessage}</p>
                </template>
            </section>
        </template>

        <!-- ======================= THEME STEP ======================= -->
        <template lwc:elseif={isThemeStep}>
            <header class="d-head">
                <lightning-button
                    class="d-back"
                    variant="base"
                    icon-name="utility:back"
                    label="Back"
                    onclick={handleBackFromTheme}
                ></lightning-button>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>

            <div class="thm-head">
                <h1 class="thm-title">Pick a theme</h1>
                <p class="thm-sub">{themeSub}</p>
            </div>

            <c-final-theme-gallery
                layout={themeGalleryLayout}
                pane-flow={themeGalleryPaneFlow}
                form-layout={themeGalleryFormLayout}
                selected-theme-key={chosenThemeKey}
                onthemeselect={handleThemeSelect}
            ></c-final-theme-gallery>
        </template>

        <!-- ============================ DETAIL (final page) ============================= -->
        <template lwc:elseif={isDetailsStep}>
            <header class="d-head">
                <lightning-button
                    class="d-back"
                    variant="base"
                    icon-name="utility:back"
                    label="Back"
                    onclick={handleBackToTheme}
                ></lightning-button>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>

            <div class="d-body">
                <!-- Left: configure -->
                <div class="d-config">
                    <lightning-input
                        class="d-input"
                        label="Form name"
                        value={formName}
                        onchange={handleName}
                        placeholder="Name your form…"
                    ></lightning-input>

                    <div class="obj-picker">
                        <lightning-input
                            class="d-input"
                            label="Primary object"
                            autocomplete="off"
                            value={objectSearch}
                            onchange={handleObjectSearch}
                            onfocus={handleObjectFocus}
                            onblur={handleObjectBlur}
                            placeholder="Choose an object…"
                        ></lightning-input>
                        <template lwc:if={objectOpen}>
                            <div class="obj-list">
                                <template for:each={objectOptions} for:item="o">
                                    <div
                                        key={o.value}
                                        class={o.cls}
                                        data-value={o.value}
                                        data-label={o.label}
                                        onmousedown={handleObjectPick}
                                    >
                                        <span class="obj-label">{o.label}</span>
                                        <span class="obj-api">{o.value}</span>
                                    </div>
                                </template>
                                <template lwc:if={hasObjectResults}></template>
                                <template lwc:else>
                                    <div class="obj-empty">No matches</div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <div class="d-section-label">Appearance</div>

                    <lightning-combobox
                        class="d-input d-select"
                        label="Layout"
                        options={layoutComboOptions}
                        value={layoutValue}
                        onchange={handleLayoutDropdown}
                    ></lightning-combobox>

                    <div class="d-theme-field">
                        <span class="d-field-label">Theme</span>
                        <button
                            class="d-theme-chip"
                            type="button"
                            onclick={handleChangeTheme}
                        >
                            <span class="d-theme-name">{chosenThemeLabel}</span>
                            <span class="d-theme-change">
                                <lightning-icon
                                    icon-name="utility:image"
                                    size="xx-small"
                                ></lightning-icon>
                                Change
                            </span>
                        </button>
                    </div>

                    <div lwc:if={errorMessage} class="d-error" role="alert">
                        <lightning-icon
                            icon-name="utility:error"
                            variant="error"
                            size="x-small"
                        ></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>

                    <div class="d-actions">
                        <lightning-button
                            class="cg-create"
                            variant="brand"
                            label={createFormLabel}
                            onclick={handleCreate}
                            disabled={createDisabled}
                        ></lightning-button>
                    </div>
                </div>

                <!-- Right: live preview -->
                <div class="d-preview">
                    <div class="d-preview-bar">
                        <span class="d-preview-label">Live preview</span>
                        <c-final-button-group
                            class="dev-toggle"
                            label="Preview width"
                            options={deviceGroupOptions}
                            value={previewDevice}
                            onchange={handleDevice}
                        ></c-final-button-group>
                    </div>
                    <div class="d-stage" aria-hidden="true">
                        <div class="pv-fit" style={previewFitStyle}>
                            <div
                                class={previewFrameClass}
                                style={previewFrameStyle}
                            >
                                <c-final-form-viewer
                                    spec={previewSpec}
                                ></c-final-form-viewer>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ================== SURVEY DETAILS (Survey path, final) ================== -->
        <template lwc:elseif={isSurveyDetailsStep}>
            <header class="d-head">
                <lightning-button
                    class="d-back"
                    variant="base"
                    icon-name="utility:back"
                    label="Back"
                    onclick={handleBackToTheme}
                ></lightning-button>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>

            <div class="d-body">
                <!-- Left: configure -->
                <div class="d-config">
                    <lightning-input
                        class="d-input"
                        label="Survey name"
                        value={surveyName}
                        onchange={handleSurveyName}
                        placeholder={chosenTemplateName}
                    ></lightning-input>

                    <div class="obj-picker">
                        <lightning-input
                            class="d-input"
                            label="Object (optional)"
                            autocomplete="off"
                            value={objectSearch}
                            onchange={handleObjectSearch}
                            onfocus={handleObjectFocus}
                            onblur={handleObjectBlur}
                            placeholder="Connect an object, or skip this"
                        ></lightning-input>
                        <template lwc:if={objectOpen}>
                            <div class="obj-list">
                                <template for:each={objectOptions} for:item="o">
                                    <div
                                        key={o.value}
                                        class={o.cls}
                                        data-value={o.value}
                                        data-label={o.label}
                                        onmousedown={handleObjectPick}
                                    >
                                        <span class="obj-label">{o.label}</span>
                                        <span class="obj-api">{o.value}</span>
                                    </div>
                                </template>
                                <template lwc:if={hasObjectResults}></template>
                                <template lwc:else>
                                    <div class="obj-empty">No matches</div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <p class="d-help">
                        Connecting an object lets questions map to its fields
                        and prefill answers from a record. You can add or change
                        it later in the builder.
                    </p>

                    <div class="d-theme-field">
                        <span class="d-field-label">Theme</span>
                        <button
                            class="d-theme-chip"
                            type="button"
                            onclick={handleChangeTheme}
                        >
                            <span class="d-theme-name">{chosenThemeLabel}</span>
                            <span class="d-theme-change">
                                <lightning-icon
                                    icon-name="utility:image"
                                    size="xx-small"
                                ></lightning-icon>
                                Change
                            </span>
                        </button>
                    </div>

                    <div lwc:if={errorMessage} class="d-error" role="alert">
                        <lightning-icon
                            icon-name="utility:error"
                            variant="error"
                            size="x-small"
                        ></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>

                    <div class="d-actions">
                        <lightning-button
                            class="cg-create"
                            variant="brand"
                            label={createSurveyLabel}
                            onclick={handleCreateSurvey}
                            disabled={isCreating}
                        ></lightning-button>
                    </div>
                </div>

                <!-- Right: live preview -->
                <div class="d-preview">
                    <div class="d-preview-bar">
                        <span class="d-preview-label">Live preview</span>
                        <c-final-button-group
                            class="dev-toggle"
                            label="Preview width"
                            options={deviceGroupOptions}
                            value={previewDevice}
                            onchange={handleDevice}
                        ></c-final-button-group>
                    </div>
                    <div class="d-stage" aria-hidden="true">
                        <div class="pv-fit" style={previewFitStyle}>
                            <div
                                class={previewFrameClass}
                                style={previewFrameStyle}
                            >
                                <c-final-form-viewer
                                    spec={previewSpec}
                                ></c-final-form-viewer>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ============== FREEFORM DETAILS (Freeform path, final) ============== -->
        <template lwc:elseif={isFreeformDetailsStep}>
            <header class="d-head">
                <lightning-button
                    class="d-back"
                    variant="base"
                    icon-name="utility:back"
                    label="Back"
                    onclick={handleBackToTheme}
                ></lightning-button>
                <lightning-button-icon
                    class="g-close"
                    icon-name="utility:close"
                    variant="bare"
                    size="large"
                    alternative-text="Close"
                    title="Close"
                    onclick={handleClose}
                ></lightning-button-icon>
            </header>

            <div class="d-body">
                <!-- Left: configure -->
                <div class="d-config">
                    <lightning-input
                        class="d-input"
                        label="Freeform name"
                        value={formName}
                        onchange={handleName}
                        placeholder={chosenTemplateName}
                    ></lightning-input>

                    <p class="d-help">
                        Answers are kept with this submission. Nothing is
                        written to Salesforce records until you set up mapping,
                        and you can add that later without touching your
                        questions.
                    </p>

                    <div class="d-theme-field">
                        <span class="d-field-label">Theme</span>
                        <button
                            class="d-theme-chip"
                            type="button"
                            onclick={handleChangeTheme}
                        >
                            <span class="d-theme-name">{chosenThemeLabel}</span>
                            <span class="d-theme-change">
                                <lightning-icon
                                    icon-name="utility:image"
                                    size="xx-small"
                                ></lightning-icon>
                                Change
                            </span>
                        </button>
                    </div>

                    <div lwc:if={errorMessage} class="d-error" role="alert">
                        <lightning-icon
                            icon-name="utility:error"
                            variant="error"
                            size="x-small"
                        ></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>

                    <div class="d-actions">
                        <lightning-button
                            class="cg-create"
                            variant="brand"
                            label={createFreeformLabel}
                            onclick={handleCreateFreeform}
                            disabled={isCreating}
                        ></lightning-button>
                    </div>
                </div>

                <!-- Right: live preview -->
                <div class="d-preview">
                    <div class="d-preview-bar">
                        <span class="d-preview-label">Live preview</span>
                        <c-final-button-group
                            class="dev-toggle"
                            label="Preview width"
                            options={deviceGroupOptions}
                            value={previewDevice}
                            onchange={handleDevice}
                        ></c-final-button-group>
                    </div>
                    <div class="d-stage" aria-hidden="true">
                        <div class="pv-fit" style={previewFitStyle}>
                            <div
                                class={previewFrameClass}
                                style={previewFrameStyle}
                            >
                                <c-final-form-viewer
                                    spec={previewSpec}
                                ></c-final-form-viewer>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ============================== DONE ============================= -->
        <template lwc:elseif={isDone}>
            <div class="done">
                <lightning-icon
                    icon-name="utility:success"
                    variant="success"
                    size="large"
                ></lightning-icon>
                <h2 class="done-title">{doneTitle}</h2>
                <p class="done-sub">
                    It opens in the builder so you can make it yours.
                </p>
                <div class="done-actions">
                    <lightning-button
                        class="cg-secondary"
                        label="Create another"
                        onclick={handleStartOver}
                    ></lightning-button>
                    <lightning-button
                        class="cg-secondary"
                        label="Done"
                        onclick={handleClose}
                    ></lightning-button>
                    <a
                        class="cg-create cg-open-link"
                        href={createdStudioHref}
                        target="_blank"
                        rel="noopener"
                    >
                        Open in Studio
                    </a>
                </div>
            </div>
        </template>
    </div>
</template>
