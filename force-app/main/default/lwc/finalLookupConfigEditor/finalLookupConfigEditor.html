<template>
    <div class="lce">
        <template lwc:if={describeError}>
            <p class="lce-error" role="alert">{describeError}</p>
        </template>

        <template lwc:elseif={loading}>
            <p class="lce-muted">Loading the fields on {objectLabel}…</p>
        </template>

        <template lwc:else>
            <!-- SHOW -->
            <div class="lce-fld">
                <span class="lce-label">Show</span>
                <p class="lce-muted">
                    Each result shows its name. Add a second line to tell
                    similar records apart.
                </p>
                <select
                    class="lce-select"
                    aria-label="Second line in each result"
                    onchange={handleSecondaryChange}
                >
                    <template for:each={secondaryOptions} for:item="o">
                        <option
                            key={o.value}
                            value={o.value}
                            selected={o.selected}
                        >
                            {o.label}
                        </option>
                    </template>
                </select>
            </div>

            <!-- SEARCH BY -->
            <div class="lce-fld">
                <span class="lce-label">Search by</span>
                <select
                    class="lce-select"
                    aria-label="Field to search on"
                    onchange={handleSearchChange}
                >
                    <template for:each={searchOptions} for:item="o">
                        <option
                            key={o.value}
                            value={o.value}
                            selected={o.selected}
                        >
                            {o.label}
                        </option>
                    </template>
                </select>
            </div>

            <!-- LIMIT RESULTS -->
            <div class="lce-fld">
                <span class="lce-label">Limit results</span>
                <template lwc:if={hasConditions}>
                    <ul class="lce-list">
                        <template for:each={rows} for:item="r">
                            <li key={r.key} class="lce-row">
                                <div class="lce-row-line">
                                    <select
                                        class="lce-select lce-grow"
                                        aria-label="Field on the searched object"
                                        data-index={r.index}
                                        onchange={handleFieldChange}
                                    >
                                        <template
                                            for:each={r.fieldOptions}
                                            for:item="o"
                                        >
                                            <option
                                                key={o.value}
                                                value={o.value}
                                                selected={o.selected}
                                            >
                                                {o.label}
                                            </option>
                                        </template>
                                    </select>
                                    <button
                                        type="button"
                                        class="lce-x"
                                        title="Remove this condition"
                                        data-index={r.index}
                                        onclick={handleRemoveCondition}
                                    >
                                        ×
                                    </button>
                                </div>

                                <div class="lce-row-line">
                                    <select
                                        class="lce-select"
                                        aria-label="Comparison"
                                        data-index={r.index}
                                        onchange={handleOperatorChange}
                                    >
                                        <template
                                            for:each={r.operatorOptions}
                                            for:item="o"
                                        >
                                            <option
                                                key={o.value}
                                                value={o.value}
                                                selected={o.selected}
                                            >
                                                {o.label}
                                            </option>
                                        </template>
                                    </select>
                                    <select
                                        class="lce-select"
                                        aria-label="Compare against"
                                        data-index={r.index}
                                        onchange={handleKindChange}
                                    >
                                        <template
                                            for:each={r.kindOptions}
                                            for:item="o"
                                        >
                                            <option
                                                key={o.value}
                                                value={o.value}
                                                selected={o.selected}
                                            >
                                                {o.label}
                                            </option>
                                        </template>
                                    </select>
                                </div>

                                <div class="lce-row-line">
                                    <template lwc:if={r.isAnswer}>
                                        <template
                                            lwc:if={r.noCompatibleSources}
                                        >
                                            <p class="lce-muted lce-grow">
                                                No question on this form can
                                                answer that.
                                            </p>
                                        </template>
                                        <template lwc:else>
                                            <select
                                                class="lce-select lce-grow"
                                                aria-label="Answer to read"
                                                data-index={r.index}
                                                onchange={handleSourceChange}
                                            >
                                                <option value="">
                                                    Choose a question…
                                                </option>
                                                <template
                                                    for:each={r.sourceOptions}
                                                    for:item="o"
                                                >
                                                    <option
                                                        key={o.value}
                                                        value={o.value}
                                                        selected={o.selected}
                                                    >
                                                        {o.label}
                                                    </option>
                                                </template>
                                            </select>
                                        </template>
                                    </template>

                                    <template lwc:elseif={r.isPicklist}>
                                        <select
                                            class="lce-select lce-grow"
                                            aria-label="Fixed value"
                                            data-index={r.index}
                                            onchange={handleConstantChange}
                                        >
                                            <template
                                                for:each={r.picklistOptions}
                                                for:item="o"
                                            >
                                                <option
                                                    key={o.value}
                                                    value={o.value}
                                                    selected={o.selected}
                                                >
                                                    {o.label}
                                                </option>
                                            </template>
                                        </select>
                                    </template>

                                    <template lwc:elseif={r.isBoolean}>
                                        <label class="lce-check">
                                            <input
                                                type="checkbox"
                                                data-index={r.index}
                                                checked={r.booleanChecked}
                                                onchange={handleConstantChange}
                                            />
                                            <span>Ticked</span>
                                        </label>
                                    </template>

                                    <template lwc:elseif={r.isNumber}>
                                        <input
                                            type="number"
                                            class="lce-input lce-grow"
                                            aria-label="Fixed value"
                                            data-index={r.index}
                                            value={r.constant}
                                            onchange={handleConstantChange}
                                        />
                                    </template>

                                    <template lwc:else>
                                        <input
                                            type="text"
                                            class="lce-input lce-grow"
                                            aria-label="Fixed value"
                                            data-index={r.index}
                                            value={r.constant}
                                            onchange={handleConstantChange}
                                        />
                                    </template>
                                </div>

                                <template lwc:if={r.error}>
                                    <p class="lce-rowerror" role="alert">
                                        {r.error}
                                    </p>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>

                <template lwc:else>
                    <p class="lce-muted">
                        Every {objectLabel} is offered. Add a condition to
                        narrow the list.
                    </p>
                </template>

                <button
                    type="button"
                    class="lce-add"
                    onclick={handleAddCondition}
                >
                    Add condition
                </button>
            </div>

            <!-- MATCH -->
            <template lwc:if={showsMatchMode}>
                <div class="lce-fld">
                    <span class="lce-label">Match</span>
                    <div class="lce-seg" role="group" aria-label="Match">
                        <button
                            type="button"
                            class="lce-segbtn"
                            data-value="all"
                            aria-pressed={matchAll}
                            onclick={handleModeChange}
                        >
                            All conditions
                        </button>
                        <button
                            type="button"
                            class="lce-segbtn"
                            data-value="any"
                            aria-pressed={matchAny}
                            onclick={handleModeChange}
                        >
                            Any condition
                        </button>
                    </div>
                </div>
            </template>

            <template lwc:if={dependencyNote}>
                <p class="lce-note">{dependencyNote}</p>
            </template>
        </template>
    </div>
</template>
