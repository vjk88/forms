<template>
    <div class="ve">
        <template lwc:if={empty}>
            <p class="ve-empty">
                No extra checks. Add one for email, phone, ranges, length, or
                matching answers — no formulas needed.
            </p>
        </template>
        <ul class="ve-list">
            <template for:each={rows} for:item="r">
                <li key={r.key} class="ve-entry">
                    <div class="ve-entry-head">
                        <lightning-combobox
                            class="ve-type"
                            variant="label-hidden"
                            label="Check type"
                            data-index={r.index}
                            options={r.presetOptions}
                            value={r.presetValue}
                            onchange={handlePreset}
                        ></lightning-combobox>
                        <lightning-button-icon
                            class="ve-x"
                            variant="bare"
                            icon-name="utility:close"
                            alternative-text="Remove this check"
                            title="Remove this check"
                            data-index={r.index}
                            onclick={handleRemove}
                        ></lightning-button-icon>
                    </div>

                    <template lwc:if={r.isRange}>
                        <div class="ve-minmax">
                            <lightning-input
                                type="number"
                                step="any"
                                class="ve-input"
                                variant="label-hidden"
                                label="Minimum"
                                placeholder="Min"
                                data-index={r.index}
                                data-param="min"
                                value={r.min}
                                oncommit={handleParam}
                            ></lightning-input>
                            <lightning-input
                                type="number"
                                step="any"
                                class="ve-input"
                                variant="label-hidden"
                                label="Maximum"
                                placeholder="Max"
                                data-index={r.index}
                                data-param="max"
                                value={r.max}
                                oncommit={handleParam}
                            ></lightning-input>
                        </div>
                    </template>
                    <template lwc:elseif={r.isLength}>
                        <div class="ve-minmax">
                            <lightning-input
                                type="number"
                                step="any"
                                class="ve-input"
                                variant="label-hidden"
                                label="Minimum characters"
                                placeholder="Min characters"
                                data-index={r.index}
                                data-param="minLen"
                                value={r.minLen}
                                oncommit={handleParam}
                            ></lightning-input>
                            <lightning-input
                                type="number"
                                step="any"
                                class="ve-input"
                                variant="label-hidden"
                                label="Maximum characters"
                                placeholder="Max characters"
                                data-index={r.index}
                                data-param="maxLen"
                                value={r.maxLen}
                                oncommit={handleParam}
                            ></lightning-input>
                        </div>
                    </template>
                    <template lwc:elseif={r.isMatch}>
                        <lightning-combobox
                            class="ve-select"
                            variant="label-hidden"
                            label="Answer to match"
                            placeholder="Pick the answer to match…"
                            data-index={r.index}
                            data-param="compareTo"
                            options={r.sourceOptions}
                            value={r.compareTo}
                            onchange={handleParam}
                        ></lightning-combobox>
                    </template>

                    <lightning-input
                        class="ve-input"
                        variant="label-hidden"
                        label="Error message"
                        placeholder="Error message the visitor sees"
                        data-index={r.index}
                        data-param="message"
                        value={r.message}
                        oncommit={handleParam}
                    ></lightning-input>
                </li>
            </template>
        </ul>
        <lightning-button
            class="ve-add"
            variant="base"
            icon-name="utility:add"
            label="Add check"
            onclick={handleAdd}
        ></lightning-button>
    </div>
</template>
