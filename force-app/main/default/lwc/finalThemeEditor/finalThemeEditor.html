<template>
    <c-final-studio-dialog
        size="large"
        label={title}
        confirm-label={confirmLabel}
        discard-text="Your theme hasn’t been saved yet."
        dirty={dirty}
        busy={saving}
        onconfirm={handleConfirm}
        ondismiss={handleDismiss}
    >
        <div slot="body" class="te">
            <template lwc:if={ready}>
                <div class="te-form">
                    <section class="te-step">
                        <label class="te-h" for="te-name">Theme name</label>
                        <input
                            id="te-name"
                            class="te-name"
                            type="text"
                            maxlength="80"
                            value={name}
                            placeholder="e.g. Brand Purple"
                            oninput={handleName}
                        />
                    </section>

                    <section class="te-step" aria-labelledby="te-start-h">
                        <h2 id="te-start-h" class="te-h">Start from</h2>
                        <p class="te-hint">
                            Everything below is calculated from this. Anything
                            you change by hand stays when you change it.
                        </p>
                        <div
                            class="te-segs"
                            role="group"
                            aria-label="Start from"
                        >
                            <template for:each={startOptions} for:item="o">
                                <button
                                    key={o.value}
                                    type="button"
                                    class={o.cls}
                                    data-value={o.value}
                                    aria-pressed={o.pressed}
                                    onclick={handleStart}
                                >
                                    {o.label}
                                </button>
                            </template>
                        </div>
                        <div class="te-startbox">
                            <template lwc:if={confirmRebuild}>
                                <div class="te-rebuild" role="alert">
                                    <p>
                                        This recalculates every color and
                                        setting from {confirmRebuildLabel}.
                                        Settings you change after this are kept.
                                    </p>
                                    <div class="te-row">
                                        <button
                                            type="button"
                                            class="te-btn te-btn--primary"
                                            onclick={handleRebuildYes}
                                        >
                                            Recalculate
                                        </button>
                                        <button
                                            type="button"
                                            class="te-btn"
                                            onclick={handleRebuildNo}
                                        >
                                            Keep as saved
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <template lwc:if={isCurrentStart}>
                                <p class="te-hint">
                                    This theme was saved before starting points
                                    were kept, so it shows exactly as saved.
                                    Pick A theme or Your brand to recalculate
                                    from one.
                                </p>
                            </template>
                            <template lwc:if={isThemeStart}>
                                <label class="te-sub" for="te-theme"
                                    >Theme</label
                                >
                                <select
                                    id="te-theme"
                                    class="te-select"
                                    onchange={handleThemeSelect}
                                >
                                    <template
                                        for:each={themeOptions}
                                        for:item="o"
                                    >
                                        <option
                                            key={o.value}
                                            value={o.value}
                                            selected={o.selected}
                                        >
                                            {o.label}
                                        </option>
                                    </template>
                                </select>
                            </template>
                            <template lwc:if={isBrandStart}>
                                <c-final-brand-inputs
                                    initial-color={brand.color}
                                    initial-second={brand.second}
                                    initial-style={brand.style}
                                    fonts={brandFonts}
                                    current-logo-url={currentLogoUrl}
                                    header-arrangement={headerArrangement}
                                    onbrandchange={handleBrandChange}
                                    onlogochange={handleLogoChange}
                                ></c-final-brand-inputs>
                            </template>
                        </div>
                    </section>

                    <section class="te-step" aria-labelledby="te-colors-h">
                        <h2 id="te-colors-h" class="te-h">Colors</h2>
                        <p class="te-hint">
                            All 18 colors this theme sets. “Automatic” ones
                            follow the others until you change them.
                        </p>
                        <template for:each={colorGroups} for:item="g">
                            <div key={g.key} class="te-cgroup">
                                <h3 class="te-cgroup-h">{g.label}</h3>
                                <div class="te-crows">
                                    <template for:each={g.rows} for:item="c">
                                        <div
                                            key={c.key}
                                            class="te-crow"
                                            data-row={c.path}
                                            role="group"
                                            aria-label={c.groupLabel}
                                        >
                                            <div class="te-crow-top">
                                                <template lwc:if={c.flagged}>
                                                    <button
                                                        type="button"
                                                        class="te-flag"
                                                        title={c.flagWhere}
                                                        onclick={handleFlag}
                                                    >
                                                        {c.flagText}
                                                        <span
                                                            class="slds-assistive-text"
                                                            >{c.flagWhere}. Go
                                                            to Fix for me</span
                                                        >
                                                    </button>
                                                </template>
                                                <template lwc:if={c.pinned}>
                                                    <span class="te-pin"
                                                        >Changed by you ·
                                                        <button
                                                            type="button"
                                                            class="te-link"
                                                            data-path={c.bothPaths}
                                                            onclick={handleUseCalculated}
                                                        >
                                                            Use calculated
                                                        </button></span
                                                    >
                                                </template>
                                                <template
                                                    lwc:elseif={c.automatic}
                                                >
                                                    <span class="te-auto"
                                                        >Automatic</span
                                                    >
                                                </template>
                                            </div>
                                            <template lwc:if={c.isFill}>
                                                <template
                                                    lwc:if={c.showControl}
                                                >
                                                    <c-final-gradient-control
                                                        data-path={c.path}
                                                        data-gradient-path={c.gradientPath}
                                                        label={c.label}
                                                        solid={c.displayHex}
                                                        gradient={c.gradient}
                                                        edited={c.pinned}
                                                        onchange={handleGradient}
                                                    ></c-final-gradient-control>
                                                    <button
                                                        type="button"
                                                        class="te-link te-seethrough"
                                                        data-path={c.path}
                                                        data-gradient-path={c.gradientPath}
                                                        onclick={handleSeeThrough}
                                                    >
                                                        Make see-through
                                                    </button>
                                                </template>
                                                <template lwc:else>
                                                    <div class="te-none">
                                                        <span class="te-sub"
                                                            >{c.label}</span
                                                        >
                                                        <template
                                                            lwc:if={c.isNone}
                                                        >
                                                            <span
                                                                class="te-none-state"
                                                                >None
                                                                (see-through)</span
                                                            >
                                                        </template>
                                                        <template
                                                            lwc:if={c.isTranslucent}
                                                        >
                                                            <span
                                                                class="te-none-state"
                                                                >Translucent</span
                                                            >
                                                            <span
                                                                class="te-hint"
                                                                >Editing makes
                                                                this fill
                                                                solid.</span
                                                            >
                                                        </template>
                                                        <div class="te-row">
                                                            <button
                                                                type="button"
                                                                class="te-btn te-add-solid"
                                                                data-path={c.path}
                                                                data-gradient-path={c.gradientPath}
                                                                onclick={handleAddSolid}
                                                            >
                                                                Add a solid fill
                                                            </button>
                                                            <button
                                                                type="button"
                                                                class="te-btn te-add-gradient"
                                                                data-path={c.path}
                                                                data-gradient-path={c.gradientPath}
                                                                onclick={handleAddGradient}
                                                            >
                                                                Add a gradient
                                                            </button>
                                                        </div>
                                                    </div>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                                <c-final-color-control
                                                    data-path={c.path}
                                                    label={c.label}
                                                    value={c.value}
                                                    contrast-with={c.contrastWith}
                                                    subject={c.subject}
                                                    onchange={handleColor}
                                                ></c-final-color-control>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </section>

                    <section class="te-step" aria-labelledby="te-shape-h">
                        <h2 id="te-shape-h" class="te-h">Shape &amp; type</h2>
                        <div class="te-font">
                            <c-final-font-picker
                                mode="theme"
                                label="Font pairing"
                                level={fontLevel}
                                effective={fontEffective}
                                uploaded-fonts={uploadedFonts}
                                fonts-loaded={fontsLoaded}
                                onfontchange={handleFontChange}
                            ></c-final-font-picker>
                            <template lwc:if={fontPinned}>
                                <span class="te-pin"
                                    >Changed by you ·
                                    <button
                                        type="button"
                                        class="te-link"
                                        data-path={fontPaths}
                                        onclick={handleUseCalculated}
                                    >
                                        Use calculated
                                    </button></span
                                >
                            </template>
                        </div>
                        <div class="te-shape">
                            <template for:each={selectRows} for:item="s">
                                <div class="te-field" key={s.key}>
                                    <label class="te-sub" for={s.key}
                                        >{s.label}</label
                                    >
                                    <select
                                        id={s.key}
                                        class="te-select"
                                        data-key={s.key}
                                        onchange={handleSelect}
                                    >
                                        <template
                                            for:each={s.options}
                                            for:item="o"
                                        >
                                            <option
                                                key={o.value}
                                                value={o.value}
                                                selected={o.selected}
                                            >
                                                {o.label}
                                            </option>
                                        </template>
                                    </select>
                                    <template lwc:if={s.pinned}>
                                        <span class="te-pin"
                                            >Changed by you ·
                                            <button
                                                type="button"
                                                class="te-link"
                                                data-path={s.path}
                                                onclick={handleUseCalculated}
                                            >
                                                Use calculated
                                            </button></span
                                        >
                                    </template>
                                </div>
                            </template>
                            <label class="te-check">
                                <input
                                    type="checkbox"
                                    checked={glassChecked}
                                    onchange={handleGlass}
                                />
                                Glass blur
                            </label>
                        </div>
                    </section>

                    <p class="slds-assistive-text" role="status">
                        {readableStatus}
                    </p>
                    <section class={readableClass}>
                        <template lwc:if={readableOk}>
                            <h2 class="te-h">{readableTitle}</h2>
                            <p>{readableText}</p>
                        </template>
                        <template lwc:if={readablePartial}>
                            <h2 class="te-h">Readable where we could check</h2>
                            <p>
                                Everything we could check is readable.
                                <strong>Not checked:</strong> {notChecked}.
                                Check text over these in the preview.
                            </p>
                        </template>
                        <template lwc:if={readableBad}>
                            <h2 class="te-h">{attentionTitle}</h2>
                            <ul class="te-lines">
                                <template
                                    for:each={readabilityLines}
                                    for:item="l"
                                >
                                    <li key={l.key}>{l.text}</li>
                                </template>
                            </ul>
                            <template lwc:if={hasNotChecked}>
                                <p>
                                    <strong>Not checked:</strong> {notChecked}.
                                </p>
                            </template>
                            <div class="te-row">
                                <button
                                    type="button"
                                    class="te-btn te-btn--primary te-fix"
                                    onclick={handleFix}
                                >
                                    Fix for me
                                </button>
                                <span class="te-hint"
                                    >Nudges just these colors until they pass,
                                    where that’s possible. You can still save as
                                    is.</span
                                >
                            </div>
                        </template>
                        <template lwc:if={hasUnfixed}>
                            <ul class="te-lines te-unfixed">
                                <template for:each={unfixedLines} for:item="l">
                                    <li key={l.key}>{l.text}</li>
                                </template>
                            </ul>
                        </template>
                        <p class="te-note">{buttonNote}</p>
                    </section>
                </div>

                <aside class="te-preview" aria-label="Preview">
                    <h2 class="te-h">Preview</h2>
                    <c-final-theme-card
                        theme-props={previewProps}
                        label={previewLabel}
                        description={previewDescription}
                        layout={layout}
                        pane-flow={paneFlow}
                        full-bleed={previewFullBleed}
                        max-width={previewMaxWidth}
                        pane-side={previewPaneSide}
                        pane-ratio={previewPaneRatio}
                        picture={yes}
                        accent-sample={yes}
                    ></c-final-theme-card>
                    <h3 class="te-sub">What each color paints</h3>
                    <ul class="te-roles">
                        <template for:each={colorRoles} for:item="r">
                            <li key={r.key} class="te-role">
                                <span
                                    class="te-role-chip"
                                    style={r.style}
                                    aria-hidden="true"
                                ></span>
                                <span><strong>{r.name}</strong>: {r.does}</span>
                            </li>
                        </template>
                    </ul>
                </aside>
            </template>
            <template lwc:else>
                <p class="te-loading">Loading theme…</p>
            </template>
        </div>
        <div slot="footer-start" class="te-foot">
            <template lwc:if={isEdit}>
                <button
                    type="button"
                    class="te-btn"
                    disabled={saving}
                    onclick={handleSaveAsNew}
                >
                    Save as new
                </button>
            </template>
            <p class="te-error" role="alert">{error}</p>
        </div>
    </c-final-studio-dialog>
</template>
