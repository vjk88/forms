<template>
    <div class="pp">
        <header class="pp-head">
            <h3 class="pp-title">{title}</h3>
            <p class="pp-sub">{subtitle}</p>
        </header>

        <!-- SURVEY QUESTION (scale family — S2b, SURVEY_PLAN §5) -->
        <template lwc:if={isSurveyQuestion}>
            <div class="pp-group">
                <lightning-input
                    label="Question"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>

                <lightning-input
                    type="toggle"
                    label="Required"
                    checked={n.required}
                    message-toggle-active=""
                    message-toggle-inactive=""
                    onchange={handleSurveyRequired}
                ></lightning-input>

                <!-- parity with the field branch (owner 2026-08-02: fields in
                     surveys had Help text but question widgets didn't — the
                     element taxonomy was leaking into the authoring UX; the
                     renderer supported help on every type all along) -->
                <lightning-input
                    label="Help text"
                    data-prop="help"
                    value={n.help}
                    field-level-help="Shows as an info bubble beside the question"
                    onchange={handleHelp}
                ></lightning-input>
                <lightning-input
                    label="Caption"
                    placeholder="Optional context under the question"
                    value={n.description}
                    onchange={handleCaption}
                ></lightning-input>
                <!-- always visible (owner 2026-07-31: the hidden-until-typed
                     toggle was undiscoverable); empty caption renders nothing
                     either way, so an early pick is harmless -->
                <div class="pp-fld">
                    <span class="pp-label">Show caption as</span>
                    <div class="pp-seg">
                        <template for:each={captionDisplaySeg} for:item="b">
                            <button
                                key={b.value}
                                type="button"
                                class={b.cls}
                                data-value={b.value}
                                onclick={handleCaptionDisplay}
                            >
                                {b.label}
                            </button>
                        </template>
                    </div>
                </div>

                <template lwc:if={isRatingQuestion}>
                    <div class="pp-fld">
                        <span class="pp-label">Maximum</span>
                        <div class="pp-seg">
                            <template for:each={ratingMaxSeg} for:item="b">
                                <button
                                    key={b.value}
                                    type="button"
                                    class={b.cls}
                                    data-value={b.value}
                                    onclick={handleRatingMax}
                                >
                                    {b.label}
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="pp-fld">
                        <span class="pp-label">Icon</span>
                        <div class="pp-seg">
                            <template for:each={ratingIconSeg} for:item="b">
                                <button
                                    key={b.value}
                                    type="button"
                                    class={b.cls}
                                    data-value={b.value}
                                    onclick={handleRatingIcon}
                                >
                                    {b.label}
                                </button>
                            </template>
                        </div>
                    </div>
                </template>

                <template lwc:if={isOpinionScaleQuestion}>
                    <div class="pp-fld">
                        <span class="pp-label">Scale size</span>
                        <div class="pp-seg">
                            <template for:each={scaleSizeSeg} for:item="b">
                                <button
                                    key={b.value}
                                    type="button"
                                    class={b.cls}
                                    data-value={b.value}
                                    onclick={handleScaleSize}
                                >
                                    {b.label}
                                </button>
                            </template>
                        </div>
                    </div>
                </template>

                <template lwc:if={isNpsQuestion}>
                    <div class="pp-fld">
                        <span class="pp-label">Detractor coloring</span>
                        <div class="pp-seg">
                            <template for:each={npsColoringSeg} for:item="b">
                                <button
                                    key={b.value}
                                    type="button"
                                    class={b.cls}
                                    data-value={b.value}
                                    onclick={handleNpsColoring}
                                >
                                    {b.label}
                                </button>
                            </template>
                        </div>
                    </div>
                </template>

                <template lwc:if={isYesNoQuestion}>
                    <div class="pp-fld">
                        <span class="pp-label">Button labels</span>
                        <div class="pp-numrow">
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="Yes"
                                value={yesLabelText}
                                onchange={handleYesLabel}
                            />
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="No"
                                value={noLabelText}
                                onchange={handleNoLabel}
                            />
                        </div>
                    </div>
                </template>

                <template lwc:if={isImageChoiceQuestion}>
                    <lightning-input
                        type="toggle"
                        label="Allow picking several"
                        checked={cfg.multiple}
                        message-toggle-active=""
                        message-toggle-inactive=""
                        onchange={handleImageMultiple}
                    ></lightning-input>
                    <div class="pp-fld">
                        <span class="pp-label">Picture options</span>
                        <template for:each={imageOptionRows} for:item="o">
                            <div key={o.key} class="pp-optrow">
                                <template lwc:if={o.hasImage}>
                                    <img
                                        class="pp-opt-thumb"
                                        src={o.url}
                                        alt=""
                                    />
                                </template>
                                <input
                                    type="text"
                                    class="pp-input"
                                    placeholder="Label"
                                    value={o.label}
                                    data-index={o.index}
                                    data-field="label"
                                    onchange={handleImageOptionChange}
                                />
                                <label
                                    class="pp-upload-opt"
                                    title="Upload an image"
                                >
                                    Upload
                                    <input
                                        type="file"
                                        accept="image/*"
                                        class="pp-file-hidden"
                                        data-index={o.index}
                                        onchange={handleOptionImageUpload}
                                    />
                                </label>
                                <button
                                    type="button"
                                    class="pp-x"
                                    title="Remove option"
                                    data-index={o.index}
                                    onclick={handleRemoveImageOption}
                                >
                                    ×
                                </button>
                            </div>
                        </template>
                        <template lwc:if={uploadError}>
                            <p class="pp-sub" role="alert">{uploadError}</p>
                        </template>
                        <button
                            type="button"
                            class="pp-add"
                            onclick={handleAddImageOption}
                        >
                            + Add picture option
                        </button>
                    </div>
                </template>

                <template lwc:if={isRankingQuestion}>
                    <div class="pp-fld">
                        <span class="pp-label">Items to rank</span>
                        <template for:each={plainOptionRows} for:item="o">
                            <div key={o.key} class="pp-optrow">
                                <input
                                    type="text"
                                    class="pp-input"
                                    placeholder="Item label"
                                    value={o.label}
                                    data-index={o.index}
                                    data-field="label"
                                    onchange={handleImageOptionChange}
                                />
                                <button
                                    type="button"
                                    class="pp-x"
                                    title="Remove item"
                                    data-index={o.index}
                                    onclick={handleRemoveImageOption}
                                >
                                    ×
                                </button>
                            </div>
                        </template>
                        <button
                            type="button"
                            class="pp-add"
                            onclick={handleAddPlainOption}
                        >
                            + Add item
                        </button>
                    </div>
                </template>

                <template lwc:if={isMatrixQuestion}>
                    <div class="pp-fld">
                        <span class="pp-label">Statements (rows)</span>
                        <template for:each={matrixStatementRows} for:item="r">
                            <div key={r.key} class="pp-optrow">
                                <input
                                    type="text"
                                    class="pp-input"
                                    placeholder="Statement"
                                    value={r.label}
                                    data-index={r.index}
                                    onchange={handleMatrixRowChange}
                                />
                                <button
                                    type="button"
                                    class="pp-x"
                                    title="Remove statement"
                                    data-index={r.index}
                                    onclick={handleRemoveMatrixRow}
                                >
                                    ×
                                </button>
                            </div>
                        </template>
                        <button
                            type="button"
                            class="pp-add"
                            onclick={handleAddMatrixRow}
                        >
                            + Add statement
                        </button>
                    </div>
                    <p class="pp-sub">
                        Scale: Disagree → Strongly agree (4 points). On phones
                        each statement becomes its own mini-question.
                    </p>
                </template>

                <template lwc:if={isLikertQuestion}>
                    <p class="pp-sub">
                        Scale: Strongly disagree → Strongly agree (5 labeled
                        chips).
                    </p>
                </template>

                <template lwc:if={showMapping}>
                    <div class="pp-fld">
                        <label class="pp-label" for="qmapping"
                            >Map to field</label
                        >
                        <select
                            id="qmapping"
                            class="pp-select"
                            onchange={handleMappingChange}
                        >
                            <template for:each={mappingOptions} for:item="o">
                                <option
                                    key={o.value}
                                    value={o.value}
                                    selected={o.selected}
                                >
                                    {o.label}
                                </option>
                            </template>
                        </select>
                        <p class="pp-hint">
                            Also writes this answer to the connected object's
                            field on submit, and prefills it when the survey
                            opens from a record. Writes apply only when the
                            submitter can edit the field — otherwise the answer
                            is kept but the record stays untouched.
                        </p>
                        <template lwc:if={isMapped}>
                            <span class="pp-label">Direction</span>
                            <div class="pp-seg">
                                <template
                                    for:each={mappingModeSeg}
                                    for:item="b"
                                >
                                    <button
                                        key={b.value}
                                        type="button"
                                        class={b.cls}
                                        data-value={b.value}
                                        onclick={handleMappingMode}
                                    >
                                        {b.label}
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={showGuestPrefill}>
                            <lightning-input
                                type="toggle"
                                label="Prefill in guest links"
                                checked={guestPrefillOn}
                                message-toggle-active=""
                                message-toggle-inactive=""
                                field-level-help="A record link is a survey link tied to a specific record. When it's opened, this field's current value is filled in for whoever holds the link."
                                onchange={handleGuestPrefill}
                            ></lightning-input>
                            <p class="pp-hint">
                                Off by default. Only turn it on for values that
                                are safe to show anyone who has the link — it
                                reveals this field's value to them.
                            </p>
                        </template>
                    </div>
                </template>

                <template lwc:if={showEndLabels}>
                    <div class="pp-fld">
                        <span class="pp-label">End labels</span>
                        <div class="pp-numrow">
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="Left (e.g. Poor)"
                                value={endLeftText}
                                data-side="left"
                                onchange={handleEndLabel}
                            />
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="Right (e.g. Excellent)"
                                value={endRightText}
                                data-side="right"
                                onchange={handleEndLabel}
                            />
                        </div>
                    </div>
                </template>

                <template lwc:if={showTopics}>
                    <div class="pp-fld">
                        <span class="pp-label">Topics (chart tags)</span>
                        <template lwc:if={topicChips.length}>
                            <div class="pp-topic-chips">
                                <template for:each={topicChips} for:item="t">
                                    <span key={t.id} class="pp-topic-chip">
                                        {t.name}
                                        <button
                                            type="button"
                                            class="pp-topic-x"
                                            title="Remove topic"
                                            data-id={t.id}
                                            onclick={handleRemoveTopic}
                                        >
                                            ×
                                        </button>
                                    </span>
                                </template>
                            </div>
                        </template>
                        <input
                            type="text"
                            class="pp-input"
                            list="pp-topic-list"
                            placeholder="Add a topic… (type to pick or create)"
                            onchange={handleTopicEntry}
                        />
                        <datalist id="pp-topic-list">
                            <template for:each={availableTopics} for:item="t">
                                <option key={t.id} value={t.name}></option>
                            </template>
                        </datalist>
                        <template lwc:if={topicError}>
                            <p class="pp-sub" role="alert">{topicError}</p>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- FIELD (BUILDER_SURFACES §2 — the legacy surface, minus prefill) -->
        <template lwc:if={isField}>
            <div class="pp-group">
                <lightning-input
                    label="Label"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>

                <!-- Appearance: one picker for the look (DEFERRED 36,
                     IMPL_PLAN_APPEARANCE_PICKER). Each tile writes renderAs
                     and optionStyle together, so any look can be undone. -->
                <template lwc:if={showAppearanceTiles}>
                    <div class="pp-fld pp-appearance">
                        <h4 class="pp-grouptitle" id="pp-appearance-title">
                            Appearance
                        </h4>
                        <div
                            class="pp-looks"
                            role="radiogroup"
                            aria-labelledby="pp-appearance-title"
                            onkeydown={handleLookKey}
                        >
                            <template lwc:if={offersDefaultTile}>
                                <button
                                    type="button"
                                    role="radio"
                                    class={defaultTile.cls}
                                    aria-checked={defaultTile.checked}
                                    tabindex={defaultTile.tabindex}
                                    data-look="default"
                                    onclick={handleLook}
                                >
                                    <span
                                        class="pp-art pp-art-select"
                                        aria-hidden="true"
                                    >
                                        <span class="pp-art-bar"></span>
                                        <span class="pp-art-chev"></span>
                                    </span>
                                    <span class="pp-look-text">
                                        <span class="pp-look-title"
                                            >{defaultTile.title}</span
                                        >
                                        <span class="pp-look-desc"
                                            >{defaultTile.desc}</span
                                        >
                                    </span>
                                    <span
                                        class="pp-look-tick"
                                        aria-hidden="true"
                                        ><svg
                                            viewBox="0 0 16 16"
                                            focusable="false"
                                        >
                                            <path
                                                d="M3.5 8.5l3 3 6-7"
                                            ></path></svg
                                    ></span>
                                </button>
                            </template>
                            <div class="pp-look-grid">
                                <template for:each={gridTiles} for:item="t">
                                    <button
                                        key={t.look}
                                        type="button"
                                        role="radio"
                                        class={t.cls}
                                        aria-checked={t.checked}
                                        tabindex={t.tabindex}
                                        data-look={t.look}
                                        onclick={handleLook}
                                    >
                                        <span
                                            class="pp-look-tick"
                                            aria-hidden="true"
                                            ><svg
                                                viewBox="0 0 16 16"
                                                focusable="false"
                                            >
                                                <path
                                                    d="M3.5 8.5l3 3 6-7"
                                                ></path></svg
                                        ></span>
                                        <span class="pp-art" aria-hidden="true">
                                            <template lwc:if={t.isDropdown}>
                                                <span class="pp-art-select">
                                                    <span
                                                        class="pp-art-bar"
                                                    ></span>
                                                    <span
                                                        class="pp-art-chev"
                                                    ></span>
                                                </span>
                                            </template>
                                            <template lwc:if={t.isRadio}>
                                                <span class="pp-art-list">
                                                    <span class="pp-art-item"
                                                        ><span
                                                            class="pp-art-dot"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                    <span class="pp-art-item"
                                                        ><span
                                                            class="pp-art-dot"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                    <span class="pp-art-item"
                                                        ><span
                                                            class="pp-art-dot"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                </span>
                                            </template>
                                            <template lwc:if={t.isCheckbox}>
                                                <span class="pp-art-list">
                                                    <span class="pp-art-item"
                                                        ><span
                                                            class="pp-art-dot pp-art-square"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                    <span class="pp-art-item"
                                                        ><span
                                                            class="pp-art-dot pp-art-square"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                    <span class="pp-art-item"
                                                        ><span
                                                            class="pp-art-dot pp-art-square"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                </span>
                                            </template>
                                            <template lwc:if={t.isChips}>
                                                <span class="pp-art-chips">
                                                    <span
                                                        class="pp-art-chip"
                                                    ></span>
                                                    <span
                                                        class="pp-art-chip"
                                                    ></span>
                                                </span>
                                            </template>
                                            <template lwc:if={t.isCards}>
                                                <span class="pp-art-cards">
                                                    <span class="pp-art-card"
                                                        ><span
                                                            class="pp-art-thumb"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                    <span class="pp-art-card"
                                                        ><span
                                                            class="pp-art-thumb"
                                                        ></span
                                                        ><span
                                                            class="pp-art-line"
                                                        ></span
                                                    ></span>
                                                </span>
                                            </template>
                                        </span>
                                        <span class="pp-look-name"
                                            >{t.label}</span
                                        >
                                    </button>
                                </template>
                            </div>
                        </div>
                        <template lwc:if={showSeveralSwitch}>
                            <div class="pp-rule pp-several">
                                <span class="pp-rule-text">
                                    <span
                                        class="pp-rule-name"
                                        aria-hidden="true"
                                        >Allow several answers</span
                                    >
                                    <span class="pp-rule-hint"
                                        >{severalHint}</span
                                    >
                                </span>
                                <lightning-input
                                    type="toggle"
                                    variant="label-hidden"
                                    label="Allow several answers"
                                    checked={severalChecked}
                                    disabled={severalDisabled}
                                    message-toggle-active=""
                                    message-toggle-inactive=""
                                    data-rule="several"
                                    onchange={handleSeveral}
                                ></lightning-input>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={hasRenderAsChoices}>
                    <label class="pp-label" for="renderas">Display as</label>
                    <select
                        id="renderas"
                        class="pp-select pp-renderas"
                        onchange={handleRenderAs}
                    >
                        <template for:each={renderAsOptions} for:item="o">
                            <option
                                key={o.value}
                                value={o.value}
                                selected={o.selected}
                            >
                                {o.label}
                            </option>
                        </template>
                    </select>
                </template>

                <template lwc:if={isUnboundLookup}>
                    <div class="pp-fld pp-lookup-object">
                        <!-- Typed into, not scrolled: an org has hundreds. -->
                        <c-final-object-picker
                            label="Object"
                            placeholder={lookupObjectPlaceholder}
                            objects={lookupObjectOptions}
                            value={cfg.referenceTo}
                            onpick={handleLookupObject}
                        ></c-final-object-picker>
                        <template lwc:if={showLookupObjectHint}>
                            <p class="pp-hint">
                                Picking a different object clears what results
                                show, which fields are searched, the filter and
                                guest access.
                            </p>
                        </template>
                    </div>
                </template>

                <!-- Lookup results. Only for OUR control: native mode hands
                     the field to the platform, so there is nothing here to
                     configure and offering boxes would be a lie. -->
                <template lwc:if={showLookupFilter}>
                    <div class="pp-fld pp-lookup">
                        <span class="pp-label">Lookup results</span>
                        <c-final-lookup-filter
                            target-object={lookupTargetObject}
                            value={lookupConfigValue}
                            dialog-label={lookupFilterDialogLabel}
                            onlookupconfigchange={handleLookupConfigChange}
                        ></c-final-lookup-filter>
                    </div>
                </template>

                <template lwc:if={showOptionsSection}>
                    <div class="pp-fld pp-options">
                        <h4 class="pp-grouptitle">Options</h4>
                        <template lwc:if={showSchemaList}>
                            <ul
                                class="pp-schema-list"
                                aria-label="Choices from Salesforce"
                            >
                                <template for:each={schemaRows} for:item="s">
                                    <li key={s.key} class={s.cls}>
                                        <template lwc:if={s.withEmoji}>
                                            <span
                                                class="pp-schema-cell pp-schema-emoji"
                                                >{s.emoji}</span
                                            >
                                        </template>
                                        <span class="pp-schema-cell"
                                            >{s.label}</span
                                        >
                                        <span class="pp-schema-cell"
                                            >{s.value}</span
                                        >
                                    </li>
                                </template>
                            </ul>
                            <p class="pp-hint">{schemaHint}</p>
                        </template>
                        <template lwc:if={showOptionsEditor}>
                            <div class="pp-opthead" aria-hidden="true">
                                <span class="pp-opthead-grip"></span>
                                <span class="pp-opthead-emoji">Emoji</span>
                                <span>Label</span>
                                <span>Value</span>
                                <span class="pp-opthead-x"></span>
                            </div>
                            <template for:each={optionRows} for:item="o">
                                <div
                                    key={o.key}
                                    class={o.groupClass}
                                    data-index={o.index}
                                    ondragover={handleOptionDragOver}
                                    ondrop={handleOptionDrop}
                                >
                                    <div class="pp-optrow">
                                        <button
                                            type="button"
                                            class="pp-grip"
                                            draggable="true"
                                            aria-label={o.gripLabel}
                                            title="Drag to move, or use the arrow keys"
                                            data-index={o.index}
                                            ondragstart={handleGripDragStart}
                                            ondragend={handleGripDragEnd}
                                            onkeydown={handleGripKey}
                                        >
                                            <svg
                                                viewBox="0 0 10 16"
                                                focusable="false"
                                                aria-hidden="true"
                                            >
                                                <circle
                                                    cx="3"
                                                    cy="3"
                                                    r="1.4"
                                                ></circle>
                                                <circle
                                                    cx="7"
                                                    cy="3"
                                                    r="1.4"
                                                ></circle>
                                                <circle
                                                    cx="3"
                                                    cy="8"
                                                    r="1.4"
                                                ></circle>
                                                <circle
                                                    cx="7"
                                                    cy="8"
                                                    r="1.4"
                                                ></circle>
                                                <circle
                                                    cx="3"
                                                    cy="13"
                                                    r="1.4"
                                                ></circle>
                                                <circle
                                                    cx="7"
                                                    cy="13"
                                                    r="1.4"
                                                ></circle>
                                            </svg>
                                        </button>
                                        <input
                                            type="text"
                                            class="pp-input pp-emoji"
                                            placeholder="😊"
                                            title="Optional emoji shown before the label"
                                            maxlength="16"
                                            value={o.emoji}
                                            data-index={o.index}
                                            data-field="emoji"
                                            onchange={handleOptionChange}
                                        />
                                        <input
                                            type="text"
                                            class={o.labelClass}
                                            placeholder="Label"
                                            aria-label="Option label"
                                            aria-invalid={o.labelInvalid}
                                            aria-describedby={o.problemId}
                                            required
                                            value={o.label}
                                            data-index={o.index}
                                            data-field="label"
                                            onchange={handleOptionChange}
                                        />
                                        <input
                                            type="text"
                                            class={o.valueClass}
                                            placeholder="Value"
                                            aria-label="Option value"
                                            aria-invalid={o.valueInvalid}
                                            aria-describedby={o.problemId}
                                            title="Stored in answers. Autofill picks this option only when a record's value is exactly this."
                                            required
                                            value={o.value}
                                            data-index={o.index}
                                            data-field="value"
                                            onchange={handleOptionChange}
                                        />
                                        <button
                                            type="button"
                                            class="pp-x"
                                            title="Remove option"
                                            data-index={o.index}
                                            onclick={handleRemoveOption}
                                        >
                                            ×
                                        </button>
                                    </div>
                                    <template lwc:if={o.problem}>
                                        <p
                                            class="pp-opt-problem"
                                            id={o.problemId}
                                        >
                                            {o.problem}
                                        </p>
                                    </template>
                                    <template lwc:if={showOptionSublabels}>
                                        <input
                                            type="text"
                                            class="pp-input pp-sublabel"
                                            placeholder="Sublabel (optional — small line under the label)"
                                            value={o.description}
                                            data-index={o.index}
                                            data-field="description"
                                            onchange={handleOptionChange}
                                        />
                                    </template>
                                </div>
                            </template>
                            <button
                                type="button"
                                class="pp-add"
                                onclick={handleAddOption}
                            >
                                + Add option
                            </button>
                            <p class="pp-sr" aria-live="polite">
                                {moveMessage}
                            </p>
                            <template lwc:if={showAllowOther}>
                                <div class="pp-rule">
                                    <span
                                        class="pp-rule-text"
                                        aria-hidden="true"
                                    >
                                        <span class="pp-rule-name"
                                            >Allow “Other…” with free text</span
                                        >
                                    </span>
                                    <lightning-input
                                        type="toggle"
                                        variant="label-hidden"
                                        label="Allow “Other…” with free text"
                                        checked={cfg.allowOther}
                                        message-toggle-active=""
                                        message-toggle-inactive=""
                                        onchange={handleAllowOther}
                                    ></lightning-input>
                                </div>
                            </template>
                        </template>
                    </div>
                </template>

                <template lwc:if={isSlider}>
                    <div class="pp-fld">
                        <span class="pp-label">Slider range</span>
                        <div class="pp-numrow">
                            <input
                                type="number"
                                class="pp-input"
                                title="Min"
                                placeholder="Min"
                                value={slider.min}
                                data-param="min"
                                onchange={handleSlider}
                            />
                            <input
                                type="number"
                                class="pp-input"
                                title="Max"
                                placeholder="Max"
                                value={slider.max}
                                data-param="max"
                                onchange={handleSlider}
                            />
                            <input
                                type="number"
                                class="pp-input"
                                title="Step"
                                placeholder="Step"
                                value={slider.step}
                                data-param="step"
                                onchange={handleSlider}
                            />
                        </div>
                    </div>
                    <div class="pp-fld">
                        <span class="pp-label">Value display</span>
                        <div class="pp-numrow">
                            <input
                                type="text"
                                class="pp-input"
                                title="Prefix"
                                placeholder="Prefix (e.g. $)"
                                value={sliderPrefixText}
                                data-side="prefix"
                                onchange={handleSliderAffix}
                            />
                            <input
                                type="text"
                                class="pp-input"
                                title="Suffix"
                                placeholder="Suffix (e.g. /night)"
                                value={sliderSuffixText}
                                data-side="suffix"
                                onchange={handleSliderAffix}
                            />
                        </div>
                        <p class="pp-hint">
                            Wraps the big live value — prefix before, suffix
                            after (e.g. $225/night).
                        </p>
                    </div>
                    <div class="pp-fld">
                        <span class="pp-label">End labels</span>
                        <div class="pp-numrow">
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="Left (e.g. Tight budget)"
                                value={endLeftText}
                                data-side="left"
                                onchange={handleEndLabel}
                            />
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="Right (e.g. No limit)"
                                value={endRightText}
                                data-side="right"
                                onchange={handleEndLabel}
                            />
                        </div>
                    </div>
                </template>
            </div>

            <div class="pp-group pp-rules">
                <h4 class="pp-grouptitle">Rules</h4>
                <div class="pp-rule">
                    <span class="pp-rule-text" aria-hidden="true">
                        <span class="pp-rule-name">Required</span>
                    </span>
                    <lightning-input
                        type="toggle"
                        variant="label-hidden"
                        label="Required"
                        checked={n.required}
                        message-toggle-active=""
                        message-toggle-inactive=""
                        data-rule="required"
                        onchange={handleRule}
                    ></lightning-input>
                </div>
                <div class="pp-rule">
                    <span class="pp-rule-text" aria-hidden="true">
                        <span class="pp-rule-name">Read only</span>
                    </span>
                    <lightning-input
                        type="toggle"
                        variant="label-hidden"
                        label="Read only"
                        checked={n.readOnly}
                        message-toggle-active=""
                        message-toggle-inactive=""
                        data-rule="readOnly"
                        onchange={handleRule}
                    ></lightning-input>
                </div>
            </div>

            <div class="pp-group pp-guidance">
                <h4 class="pp-grouptitle">Text &amp; guidance</h4>
                <lightning-input
                    label="Help text"
                    data-prop="help"
                    value={n.help}
                    field-level-help="Shows as an info bubble beside the label"
                    onchange={handleHelp}
                ></lightning-input>
                <!-- round-4 ruling says EVERY question gets caption/help
                     display — text questions had no writer until 2026-07-31
                     (the renderer always supported it) -->
                <lightning-input
                    label="Caption"
                    placeholder="Optional context under the label"
                    value={n.description}
                    onchange={handleCaption}
                ></lightning-input>
                <div class="pp-fld">
                    <span class="pp-label">Show caption as</span>
                    <div class="pp-seg">
                        <template for:each={captionDisplaySeg} for:item="b">
                            <button
                                key={b.value}
                                type="button"
                                class={b.cls}
                                data-value={b.value}
                                onclick={handleCaptionDisplay}
                            >
                                {b.label}
                            </button>
                        </template>
                    </div>
                </div>
                <lightning-input
                    label="Placeholder"
                    data-prop="placeholder"
                    value={n.placeholder}
                    onchange={handlePlaceholder}
                ></lightning-input>
            </div>

            <div class="pp-group">
                <h4 class="pp-grouptitle">Checks</h4>
                <c-final-validation-editor
                    entries={extraValidation}
                    sources={compareSources}
                    onvalidationchange={handleValidationChange}
                ></c-final-validation-editor>
            </div>
        </template>

        <!-- DISPLAY TEXT -->
        <template lwc:elseif={isRichText}>
            <div class="pp-group">
                <lightning-input
                    label="Label"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>
                <lightning-input-rich-text
                    label="Text"
                    data-prop="html"
                    label-visible
                    value={cfg.html}
                    onchange={handleRichText}
                ></lightning-input-rich-text>
            </div>
        </template>

        <!-- IMAGE (upload-only — owner 2026-07-10) -->
        <template lwc:elseif={isImage}>
            <div class="pp-group">
                <lightning-input
                    label="Label"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>
                <div class="pp-fld">
                    <span class="pp-label">Image</span>
                    <template lwc:if={hasImageSrc}>
                        <div class="pp-thumb">
                            <img src={cfg.src} alt={cfg.alt} />
                        </div>
                    </template>
                    <div class="pp-mediarow">
                        <label class="pp-upload">
                            <input
                                type="file"
                                accept="image/png,image/jpeg,image/gif,image/webp"
                                disabled={uploading}
                                onchange={handleImageUpload}
                            />
                            {uploadLabel}
                        </label>
                        <template lwc:if={hasImageSrc}>
                            <button
                                type="button"
                                class="pp-remove"
                                onclick={handleImageRemove}
                            >
                                Remove
                            </button>
                        </template>
                    </div>
                    <template lwc:if={uploadError}>
                        <p class="pp-error" role="alert">{uploadError}</p>
                    </template>
                </div>
                <lightning-input
                    label="Alt text"
                    data-prop="alt"
                    value={cfg.alt}
                    field-level-help="Read by screen readers; shown if the image can't load"
                    onchange={handleImageAlt}
                ></lightning-input>
                <div class="pp-fld">
                    <span class="pp-label">Size</span>
                    <div class="pp-seg">
                        <template for:each={imageSizeSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleImageSize}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- CALLOUT -->
        <template lwc:elseif={isCallout}>
            <div class="pp-group">
                <lightning-input
                    label="Label"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>
                <div class="pp-fld">
                    <span class="pp-label">Tone</span>
                    <div class="pp-seg">
                        <template for:each={calloutToneSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleCalloutTone}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
                <lightning-input-rich-text
                    label="Message"
                    data-prop="html"
                    label-visible
                    value={cfg.html}
                    onchange={handleRichText}
                ></lightning-input-rich-text>
            </div>
        </template>

        <!-- SPACER -->
        <template lwc:elseif={isSpacer}>
            <div class="pp-group">
                <div class="pp-fld">
                    <span class="pp-label">Size</span>
                    <div class="pp-seg">
                        <template for:each={spacerSizeSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleSpacerSize}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- CONSENT -->
        <template lwc:elseif={isConsent}>
            <div class="pp-group">
                <lightning-input
                    label="Label"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>
                <lightning-input-rich-text
                    label="Consent text"
                    data-prop="html"
                    label-visible
                    value={cfg.html}
                    onchange={handleRichText}
                ></lightning-input-rich-text>
                <div class="pp-fld">
                    <span class="pp-label">Acceptance</span>
                    <div class="pp-seg">
                        <template for:each={consentSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleConsentToggle}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- DIVIDER -->
        <template lwc:elseif={isDivider}>
            <p class="pp-hint pp-only">
                A divider has no settings — its look comes from the form theme.
            </p>
        </template>

        <!-- FILE UPLOAD -->
        <template lwc:elseif={isFile}>
            <div class="pp-group">
                <lightning-input
                    label="Label"
                    data-prop="label"
                    value={n.label}
                    onchange={handleLabel}
                ></lightning-input>
                <p class="pp-hint">
                    Respondents attach files when they submit. The label above
                    is what they&#8217;ll see.
                </p>
            </div>
        </template>

        <!-- EMPTY SPACE -->
        <template lwc:elseif={isEmptySpace}>
            <template lwc:if={showEmptySpaceNote}>
                <p class="pp-hint pp-only">
                    Empty space fills a grid cell — give its section more than
                    one column to size it.
                </p>
            </template>
        </template>

        <!-- REPEATING GROUP (§4: DEDICATED — never plain section props) -->
        <template lwc:elseif={isRepeater}>
            <div class="pp-group">
                <lightning-input
                    label="Group title"
                    data-prop="title"
                    value={n.title}
                    onchange={handleTitle}
                ></lightning-input>
                <div class="pp-fld">
                    <span class="pp-label">Child records</span>
                    <span class="pp-ro">{repeat.childObject}</span>
                </div>
                <div class="pp-fld">
                    <span class="pp-label">Display style</span>
                    <div class="pp-seg">
                        <template for:each={repeatStyleSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleRepeatStyle}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
                <lightning-input
                    label="Add-button label"
                    data-prop="addlabel"
                    value={repeat.addLabel}
                    onchange={handleAddLabel}
                ></lightning-input>
                <div class="pp-minmax">
                    <lightning-input
                        type="number"
                        label="Min rows"
                        data-prop="min"
                        value={repeat.min}
                        min="0"
                        onchange={handleMin}
                    ></lightning-input>
                    <lightning-input
                        type="number"
                        label="Max rows (0 = unlimited)"
                        data-prop="max"
                        value={repeat.max}
                        min="0"
                        onchange={handleMax}
                    ></lightning-input>
                </div>
            </div>

            <div class="pp-group">
                <h4 class="pp-grouptitle">{childHeading}</h4>
                <p class="pp-hint">
                    Click a field to add it to every entry of this group.
                </p>
                <template lwc:if={childError}>
                    <p class="pp-error" role="alert">{childError}</p>
                </template>
                <template lwc:elseif={childLoading}>
                    <lightning-spinner
                        alternative-text="Loading child fields"
                        size="small"
                    ></lightning-spinner>
                </template>
                <ul class="pp-childlist">
                    <template for:each={childRows} for:item="f">
                        <li key={f.apiName}>
                            <button
                                type="button"
                                class={f.cls}
                                title={f.title}
                                data-api={f.apiName}
                                onclick={handleAddChildField}
                            >
                                <span class="pp-childlabel">
                                    <template lwc:if={f.required}>
                                        <abbr class="pp-req" title="required"
                                            >*</abbr
                                        >
                                    </template>
                                    {f.label}
                                </span>
                                <span class="pp-childtype">{f.inputType}</span>
                                <template lwc:if={f.added}>
                                    <span class="pp-added">ADDED</span>
                                </template>
                            </button>
                        </li>
                    </template>
                </ul>
            </div>
        </template>

        <!-- SECTION (BUILDER_SURFACES §3 — the legacy surface) -->
        <template lwc:elseif={isSection}>
            <div class="pp-group">
                <lightning-input
                    label="Title"
                    data-prop="title"
                    value={n.title}
                    onchange={handleTitle}
                ></lightning-input>

                <div class="pp-fld">
                    <span class="pp-label">Columns</span>
                    <div class="pp-seg">
                        <template for:each={columnsSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleColumns}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>

                <div class="pp-fld">
                    <span class="pp-label">Header</span>
                    <button
                        type="button"
                        class={headerToggleClass}
                        onclick={handleHeaderToggle}
                    >
                        {headerToggleLabel}
                    </button>
                </div>
                <template lwc:if={hasHeaderRepeat}>
                    <p class="pp-hint" data-id="header-repeat">
                        {headerRepeatHint}
                    </p>
                </template>

                <template lwc:if={showHeader}>
                    <div class="pp-fld">
                        <span class="pp-label">Header icon</span>
                        <div class="pp-icsearch">
                            <input
                                type="text"
                                class="pp-input"
                                placeholder="Search icons…"
                                value={iconSearch}
                                oninput={handleIconSearch}
                            />
                            <template lwc:if={hasIcon}>
                                <button
                                    type="button"
                                    class="pp-remove"
                                    title="Clear icon"
                                    onclick={handleClearIcon}
                                >
                                    Clear
                                </button>
                            </template>
                        </div>
                        <div class="pp-icgrid">
                            <template for:each={iconChoices} for:item="ic">
                                <button
                                    key={ic.key}
                                    type="button"
                                    class={ic.cls}
                                    data-icon={ic.name}
                                    title={ic.name}
                                    onclick={handleSelectIcon}
                                >
                                    <lightning-icon
                                        icon-name={ic.name}
                                        size="x-small"
                                    ></lightning-icon>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>

                <lightning-textarea
                    label="Description"
                    data-prop="description"
                    value={n.description}
                    onchange={handleDescription}
                ></lightning-textarea>

                <lightning-input
                    type="toggle"
                    label="Keep on one screen"
                    field-level-help="When the survey shows one question per page, this section's fields stay together on a single screen (like the artifact's multi-input step)."
                    checked={n.keepTogether}
                    message-toggle-active=""
                    message-toggle-inactive=""
                    onchange={handleKeepTogether}
                ></lightning-input>

                <div class="pp-fld">
                    <span class="pp-label">Collapsible</span>
                    <button
                        type="button"
                        class={collapsibleClass}
                        onclick={handleCollapsibleToggle}
                    >
                        {collapsibleLabel}
                    </button>
                </div>
                <template lwc:if={collapsible}>
                    <div class="pp-fld">
                        <span class="pp-label">Default state</span>
                        <button
                            type="button"
                            class={collapsedDefaultClass}
                            onclick={handleCollapsedDefaultToggle}
                        >
                            {collapsedDefaultLabel}
                        </button>
                    </div>
                </template>
            </div>
        </template>

        <!-- PAGE -->
        <template lwc:elseif={isPage}>
            <div class="pp-group">
                <lightning-input
                    label="Page name"
                    data-prop="pagename"
                    value={n.name}
                    onchange={handlePageName}
                ></lightning-input>
            </div>
        </template>

        <!-- forward-compat: unknown element types stay honest -->
        <template lwc:elseif={isOtherElement}>
            <p class="pp-hint pp-only">
                This element type doesn&#8217;t have an editor yet.
            </p>
        </template>

        <!-- Width — legacy showWidth: only inside a multi-column section -->
        <template lwc:if={showWidth}>
            <div class="pp-group">
                <div class="pp-fld">
                    <span class="pp-label">Width</span>
                    <div class="pp-seg">
                        <template for:each={widthSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleWidth}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Standalone block framing (legacy: never for plain-only types) -->
        <template lwc:if={showBlockStyle}>
            <div class="pp-group">
                <div class="pp-fld">
                    <span class="pp-label">Block style</span>
                    <div class="pp-seg">
                        <template for:each={blockStyleSeg} for:item="o">
                            <button
                                key={o.value}
                                type="button"
                                class={o.cls}
                                data-value={o.value}
                                onclick={handleBlockStyle}
                            >
                                {o.label}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Visibility renders on EVERY inspector (owner ruling: rules live
             on the properties; the Logic rail is just the index) -->
        <div class="pp-group">
            <h4 class="pp-grouptitle">Visibility</h4>
            <c-final-conditions-summary
                value={n.visibility}
                columns="visibility"
                sources={ruleSources}
                record-sources={recordRuleSources}
                record-object={recordRuleObject}
                is-public={formIsPublic}
                source-index={ruleIndex}
                host-repeat-section-id={hostRepeatSectionId}
                noun={ruleNoun}
                label={visibilityDialogLabel}
                description={visibilityDialogDescription}
                onconditionschange={handleRuleChange}
            ></c-final-conditions-summary>
        </div>
    </div>
</template>
