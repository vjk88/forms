<template>
    <section class="oc-editor" aria-labelledby="connection-heading">
        <h3 id="connection-heading" class="oc-heading">Salesforce object</h3>

        <template lwc:if={errorText}>
            <p class="oc-message oc-message--error" role="alert">{errorText}</p>
        </template>

        <template lwc:if={isPending}>
            <div class="oc-confirm">
                <p class="oc-title">{pendingTitle}</p>
                <template lwc:if={hasCasualties}>
                    <p class="oc-message oc-message--error">
                        These mappings will be cleared:
                    </p>
                    <ul class="oc-list">
                        <template for:each={pending.casualties} for:item="item">
                            <li key={item}>{item}</li>
                        </template>
                    </ul>
                </template>
                <template lwc:if={survivorNote}>
                    <p class="oc-help">{survivorNote}</p>
                </template>
                <template lwc:if={pending.published}>
                    <p class="oc-help">
                        Existing responses keep their original object context,
                        so reporting across this change will span two objects.
                    </p>
                </template>
                <div class="oc-actions">
                    <lightning-button
                        variant="destructive-text"
                        label={pendingCta}
                        onclick={handleConfirm}
                    ></lightning-button>
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancel}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <template lwc:elseif={isPicking}>
            <lightning-input
                type="search"
                label="Find an object"
                value={search}
                onchange={handleSearch}
            ></lightning-input>
            <template lwc:if={loadFailed}>
                <p class="oc-message oc-message--error" role="alert">
                    Couldn't load the object list.
                </p>
            </template>
            <ul class="oc-object-list" aria-label="Available objects">
                <template for:each={filteredObjects} for:item="option">
                    <li key={option.value}>
                        <button
                            type="button"
                            class="oc-object"
                            data-value={option.value}
                            onclick={handlePick}
                        >
                            <span class="oc-object-label">{option.label}</span>
                            <span class="oc-object-api">{option.value}</span>
                        </button>
                    </li>
                </template>
            </ul>
            <div class="oc-actions">
                <lightning-button
                    label="Cancel"
                    onclick={handleCancelPick}
                ></lightning-button>
            </div>
        </template>

        <template lwc:elseif={hasObject}>
            <div class="oc-current">
                <span class="oc-current-icon" aria-hidden="true">SF</span>
                <span>
                    <span class="oc-title">{displayLabel}</span>
                    <span class="oc-help">{mappedSummary}</span>
                </span>
            </div>
            <div class="oc-actions">
                <lightning-button
                    label="Change object"
                    onclick={handleOpenPicker}
                ></lightning-button>
                <lightning-button
                    variant="base"
                    label="Disconnect"
                    onclick={handleClear}
                ></lightning-button>
            </div>
        </template>

        <template lwc:else>
            <div class="oc-empty">
                <p class="oc-title">No object connected</p>
                <p class="oc-help">
                    Connect an object to unlock field mapping, guest prefill,
                    and record-based visibility rules.
                </p>
                <lightning-button
                    variant="brand"
                    label="Connect object"
                    onclick={handleOpenPicker}
                ></lightning-button>
            </div>
        </template>
    </section>
</template>
