<template>
    <template lwc:if={loading}>
        <div class="st-center">
            <lightning-spinner
                alternative-text="Loading the studio"
                size="medium"
            ></lightning-spinner>
        </div>
    </template>
    <template lwc:elseif={notFound}>
        <div class="st-center st-notfound">
            <h2>This form isn't available</h2>
            <p>
                It may have been deleted, or you may not have access. Pick a
                form from the library to keep working.
            </p>
            <button type="button" class="st-primary" onclick={handleExit}>
                Go to Forms
            </button>
        </div>
    </template>
    <template lwc:elseif={spec}>
        <header class="st-bar">
            <button type="button" class="st-exit" onclick={handleExit}>
                ← Exit
            </button>
            <span class="st-name">{formName}</span>
            <template lwc:if={hasVersions}>
                <select
                    class="st-verselect"
                    aria-label="Form version"
                    onchange={handleVersionChange}
                >
                    <template for:each={versionOptions} for:item="o">
                        <option key={o.id} value={o.id} selected={o.selected}>
                            {o.label}
                        </option>
                    </template>
                </select>
            </template>
            <template lwc:else>
                <span class="st-chip">{versionChip}</span>
            </template>
            <div class="st-modes">
                <button
                    type="button"
                    class={buildClass}
                    aria-pressed={isBuildPressed}
                    disabled={isReadOnly}
                    onclick={handleModeBuild}
                >
                    Build
                </button>
                <button
                    type="button"
                    class={designClass}
                    aria-pressed={isDesignPressed}
                    disabled={isReadOnly}
                    onclick={handleModeDesign}
                >
                    Design
                </button>
            </div>
            <template lwc:if={isEditable}>
                <span class="st-saved">{savedText}</span>
            </template>
            <template lwc:else>
                <span class="st-robadge">🔒 {readOnlyBadge}</span>
                <button
                    type="button"
                    class="st-rolink"
                    onclick={handleBackToEditable}
                >
                    {backToEditableLabel}
                </button>
            </template>
            <span class="st-spacer"></span>
            <button
                type="button"
                class="st-icon st-undo"
                title="Undo"
                disabled={undoDisabled}
                onclick={handleUndo}
            >
                ↶
            </button>
            <button
                type="button"
                class="st-icon st-redo"
                title="Redo"
                disabled={redoDisabled}
                onclick={handleRedo}
            >
                ↷
            </button>
            <template lwc:if={isEditable}>
                <div class="st-settings" onkeydown={handleSettingsKeydown}>
                    <lightning-button-icon
                        data-id="settings-trigger"
                        icon-name="utility:settings"
                        alternative-text="Form settings"
                        title="Form settings"
                        aria-haspopup="menu"
                        aria-expanded={settingsMenuOpen}
                        onclick={handleSettingsToggle}
                    ></lightning-button-icon>
                    <template lwc:if={settingsMenuOpen}>
                        <div
                            class="st-settings-menu"
                            role="menu"
                            aria-label="Form settings"
                        >
                            <template lwc:if={isSurvey}>
                                <button
                                    type="button"
                                    class="st-settings-item"
                                    role="menuitem"
                                    data-section="connection"
                                    onclick={handleOpenSettings}
                                >
                                    <span>Connected object</span>
                                    <span class="st-settings-status">
                                        {connectionStatus}
                                    </span>
                                </button>
                            </template>
                            <button
                                type="button"
                                class="st-settings-item"
                                role="menuitem"
                                data-section="availability"
                                onclick={handleOpenSettings}
                            >
                                <span>Availability</span>
                                <span class="st-settings-status">
                                    {availabilityStatus}
                                </span>
                            </button>
                            <button
                                type="button"
                                class="st-settings-item"
                                role="menuitem"
                                data-section="access"
                                onclick={handleOpenSettings}
                            >
                                <span>Access &amp; invitations</span>
                                <span class="st-settings-status">
                                    {accessStatus}
                                </span>
                            </button>
                        </div>
                    </template>
                </div>
                <lightning-button-menu
                    data-id="actions-trigger"
                    class="st-actions"
                    label="Actions"
                    alternative-text="Form actions"
                    menu-alignment="right"
                    disabled={cloneBusy}
                    onselect={handleActionSelect}
                >
                    <lightning-menu-item
                        value="clone"
                        label="Clone form"
                    ></lightning-menu-item>
                </lightning-button-menu>
            </template>
            <button
                type="button"
                class="st-primary"
                onclick={handlePublish}
                disabled={publishDisabled}
            >
                Publish
            </button>
        </header>

        <div class="st-body">
            <template lwc:if={isReadOnly}>
                <aside class="st-left st-left--notice">
                    <div class="st-notice">
                        <h3 class="st-notice-title">{readOnlyTitle}</h3>
                        <p class="st-notice-text">{readOnlyText}</p>
                        <button
                            type="button"
                            class="st-primary st-notice-btn"
                            onclick={handleBackToEditable}
                        >
                            {backToEditableLabel}
                        </button>
                    </div>
                </aside>
                <main class="st-stagearea">
                    <div class="st-scroll">
                        <c-final-preview-stage
                            spec={viewSpec}
                        ></c-final-preview-stage>
                    </div>
                </main>
            </template>
            <template lwc:elseif={isDesign}>
                <aside class="st-left">
                    <c-final-design-panel
                        spec={spec}
                        form-id={formId}
                        onspecchange={handleSpecChange}
                        onthemeedit={handleThemeEdit}
                    ></c-final-design-panel>
                </aside>
                <main class="st-stagearea">
                    <div class="st-scroll">
                        <c-final-preview-stage
                            spec={spec}
                        ></c-final-preview-stage>
                    </div>
                </main>
            </template>
            <template lwc:else>
                <aside class="st-left st-left--build">
                    <template lwc:if={showProperties}>
                        <div class="st-props">
                            <button
                                type="button"
                                class="st-back"
                                onclick={handleBackToPalette}
                            >
                                ‹ Fields
                            </button>
                            <c-final-property-panel
                                node={selectedNode}
                                kind={selectedKind}
                                binding-object-api={selectionBindingObject}
                                section-columns={selectionSectionColumns}
                                block-style={selectionBlockStyle}
                                form-id={formId}
                                rule-sources={selectionRuleSources}
                                record-rule-sources={recordRuleSources}
                                rule-index={ruleIndexMap}
                                host-repeat-section-id={selectionHostRepeat}
                                mapping-fields={mappingFields}
                                onmappingchange={handleMappingChange}
                                onmappingmodechange={handleMappingModeChange}
                                onguestprefillchange={handleGuestPrefillChange}
                                onpropchange={handlePropChange}
                                onconfigchange={handleConfigChange}
                                onrepeatchange={handleRepeatChange}
                                onblockstylechange={handleBlockStyleChange}
                                onaddchildfield={handleAddChildField}
                                onvalidationchange={handleValidationChange}
                            ></c-final-property-panel>
                        </div>
                    </template>
                    <template lwc:else>
                        <template lwc:if={isSurvey}>
                            <div class="st-survey-context">
                                <span class="st-context-icon" aria-hidden="true"
                                    >SF</span
                                >
                                <span class="st-context-copy">
                                    <span class="st-context-label"
                                        >Connected object</span
                                    >
                                    <span class="st-context-title"
                                        >{surveyContextTitle}</span
                                    >
                                    <span class="st-context-detail"
                                        >{surveyContextDetail}</span
                                    >
                                </span>
                                <lightning-button-icon
                                    icon-name="utility:edit"
                                    alternative-text="Edit connected object"
                                    title="Edit connected object"
                                    onclick={handleOpenConnectionFromContext}
                                ></lightning-button-icon>
                            </div>
                        </template>
                        <c-final-field-palette
                            object-api={objectApi}
                            survey-mode={isSurvey}
                            used-fields={usedFields}
                            used-labels={usedLabels}
                            logic-index={logicIndex}
                            onaddfield={handleAddField}
                            onaddquestion={handleAddQuestion}
                            onaddblock={handleAddBlock}
                            onaddrepeater={handleAddRepeater}
                            onlogicjump={handleLogicJump}
                        ></c-final-field-palette>
                    </template>
                </aside>
                <main class="st-blueprint">
                    <c-final-builder-canvas
                        spec={spec}
                        selection={selection}
                        current-page-index={buildPageIndex}
                        onselect={handleSelect}
                        onpagechange={handleBuildPageChange}
                        onaddpage={handleAddPage}
                        onaddsection={handleAddSection}
                        onremoveelement={handleRemoveElement}
                        onremovesection={handleRemoveSection}
                        onremovepage={handleRemovePage}
                        ondropfield={handleDropField}
                        ondropblock={handleDropBlock}
                        ondroprepeater={handleDropRepeater}
                        onmoveelement={handleMoveElement}
                        onmovesection={handleMoveSection}
                        onmovepage={handleMovePage}
                    ></c-final-builder-canvas>
                </main>
                <aside class="st-buildpreview">
                    <div class="st-scroll">
                        <c-final-preview-stage
                            spec={spec}
                            authoring
                            onelementselect={handlePreviewSelect}
                        ></c-final-preview-stage>
                    </div>
                </aside>
            </template>
        </div>

        <template lwc:if={settingsDrawerOpen}>
            <div class="st-drawer-shell" onkeydown={handleSettingsKeydown}>
                <button
                    type="button"
                    class="st-drawer-backdrop"
                    aria-label="Close settings"
                    onclick={handleCloseSettings}
                ></button>
                <aside
                    class="st-drawer"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="settings-drawer-title"
                >
                    <span
                        class="st-focus-sentinel"
                        tabindex="0"
                        onfocus={handleDrawerFocusTrap}
                    ></span>
                    <header class="st-drawer-header">
                        <div>
                            <p class="st-drawer-eyebrow">Form settings</p>
                            <h2 id="settings-drawer-title">{settingsTitle}</h2>
                        </div>
                        <lightning-button-icon
                            data-id="settings-close"
                            icon-name="utility:close"
                            alternative-text="Close settings"
                            title="Close settings"
                            onclick={handleCloseSettings}
                        ></lightning-button-icon>
                    </header>
                    <div class="st-drawer-body">
                        <c-final-studio-settings-panel
                            section={settingsSection}
                            is-survey={isSurvey}
                            object-api={objectApi}
                            mapped-count={mappedCount}
                            pending-object-change={objectPending}
                            object-error={objectError}
                            object-save-text={objectSaveText}
                            availability={availability}
                            spec-save-text={savedText}
                            is-public={isPublic}
                            public-busy={togglingPublic}
                            public-save-text={publicSaveText}
                            public-help={publicHelp}
                            minted-link={mintedLink}
                            link-busy={linkBusy}
                            link-error={linkError}
                            link-notice={linkNotice}
                            onsettingschange={handleSettingsChange}
                            onobjectpick={handleObjectPick}
                            onobjectclear={handleObjectClear}
                            onobjectconfirm={handleObjectConfirm}
                            onobjectcancel={handleObjectCancel}
                            onpublicchange={handleTogglePublic}
                            onmintlink={handleMintLink}
                            oninvalidatelinks={handleInvalidateLinks}
                            onmanageinvitations={handleManageInvitations}
                        ></c-final-studio-settings-panel>
                    </div>
                    <span
                        class="st-focus-sentinel"
                        tabindex="0"
                        onfocus={handleDrawerFocusTrap}
                    ></span>
                </aside>
            </div>
        </template>

        <template lwc:if={cloneDialogOpen}>
            <c-final-studio-action-dialog
                source-name={formName}
                busy={cloneBusy}
                error={cloneError}
                onconfirm={handleCloneConfirm}
                oncancel={handleCloneCancel}
            ></c-final-studio-action-dialog>
        </template>

        <template lwc:if={editorOpen}>
            <c-final-theme-editor
                theme-id={editorThemeId}
                start-from={editorStartFrom}
                onsave={handleThemeSaved}
                oncancel={handleEditorCancel}
            ></c-final-theme-editor>
        </template>

        <template lwc:if={relPickerOpen}>
            <c-final-relationship-picker
                object-api={objectApi}
                onpick={handleRelPick}
                oncancel={handleRelCancel}
            ></c-final-relationship-picker>
        </template>
    </template>
</template>
