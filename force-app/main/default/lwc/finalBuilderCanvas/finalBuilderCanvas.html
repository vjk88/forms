<template>
    <div class="bc">
        <div class="bc-bar">Structure</div>
        <p id="keyboard-help" class="bc-status">
            Use Tab to reach items and Enter to select. Alt + ↑ / ↓ moves an
            item up or down.
        </p>
        <span
            class="bc-status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            >{announcement}</span
        >

        <div class="bc-chips">
            <template for:each={pageChips} for:item="p">
                <span key={p.id} class="bc-chipwrap">
                    <button
                        type="button"
                        class={p.cls}
                        data-id={p.id}
                        data-nav
                        data-kind="page"
                        aria-pressed={p.pressed}
                        aria-current={p.current}
                        aria-describedby="keyboard-help"
                        onkeydown={handleNavigationKey}
                        draggable="true"
                        onclick={handleChip}
                        ondragstart={handleChipDragStart}
                        ondragend={handleDragEndClear}
                        ondragover={handleChipDragOver}
                        ondragleave={handleDragLeave}
                        ondrop={handleChipDrop}
                    >
                        {p.label}
                    </button>
                    <template lwc:if={p.removable}>
                        <button
                            type="button"
                            class="bc-x bc-chip-x"
                            title="Remove this page"
                            aria-label={p.removeLabel}
                            data-id={p.id}
                            onclick={handleRemovePage}
                        >
                            ×
                        </button>
                    </template>
                </span>
            </template>
            <button type="button" class="bc-chip add" onclick={handleAddPage}>
                + Page
            </button>
        </div>

        <div class="bc-scroll">
            <template for:each={sections} for:item="s">
                <div key={s.id} class="bc-item">
                    <div
                        class="bc-gap"
                        data-before={s.id}
                        ondragover={handleGapDragOver}
                        ondragleave={handleGapLeave}
                        ondrop={handleGapDrop}
                    ></div>
                    <template lwc:if={s.isBlock}>
                        <div
                            class={s.cls}
                            data-id={s.id}
                            data-kind="section"
                            draggable="true"
                            onclick={handleSectionClick}
                            ondragstart={handleSectionDragStart}
                            ondragend={handleDragEndClear}
                            ondragover={handleSecDragOver}
                            ondragleave={handleDragLeave}
                            ondrop={handleSectionDrop}
                        >
                            <span class="bc-grip" aria-hidden="true">⋮⋮</span>
                            <button
                                type="button"
                                class="bc-select bc-block-label"
                                data-id={s.id}
                                data-kind="section"
                                data-nav
                                aria-pressed={s.pressed}
                                aria-describedby="keyboard-help"
                                onclick={handleSectionClick}
                                onkeydown={handleNavigationKey}
                            >
                                {s.blockLabel}
                            </button>
                            <button
                                type="button"
                                class="bc-x"
                                title="Remove block"
                                aria-label={s.removeLabel}
                                data-id={s.id}
                                onclick={handleRemoveSection}
                            >
                                ×
                            </button>
                        </div>
                    </template>
                    <template lwc:else>
                        <div
                            class={s.cls}
                            data-id={s.id}
                            data-kind="section"
                            draggable="true"
                            onclick={handleSectionClick}
                            ondragstart={handleSectionDragStart}
                            ondragend={handleDragEndClear}
                            ondragover={handleSecDragOver}
                            ondragleave={handleDragLeave}
                            ondrop={handleSectionDrop}
                        >
                            <header class="bc-section-head">
                                <span class="bc-grip" aria-hidden="true"
                                    >⋮⋮</span
                                >
                                <button
                                    type="button"
                                    class="bc-select bc-tag"
                                    data-id={s.id}
                                    data-kind="section"
                                    data-nav
                                    aria-pressed={s.pressed}
                                    aria-describedby="keyboard-help"
                                    onclick={handleSectionClick}
                                    onkeydown={handleNavigationKey}
                                >
                                    {s.title}
                                </button>
                                <template lwc:if={s.repeatChip}>
                                    <span class="bc-repeat"
                                        >{s.repeatChip}</span
                                    >
                                </template>
                                <span class="bc-flex"></span>
                                <button
                                    type="button"
                                    class="bc-x"
                                    title="Remove section"
                                    aria-label={s.removeLabel}
                                    data-id={s.id}
                                    onclick={handleRemoveSection}
                                >
                                    ×
                                </button>
                            </header>
                            <template lwc:if={s.desc}>
                                <p class="bc-sec-desc">{s.desc}</p>
                            </template>
                            <div class="bc-grid" style={s.gridStyle}>
                                <template for:each={s.elements} for:item="el">
                                    <div
                                        key={el.id}
                                        class={el.cls}
                                        style={el.spanStyle}
                                        data-id={el.id}
                                        data-kind="element"
                                        data-section-id={el.sectionId}
                                        draggable="true"
                                        onclick={handleElementClick}
                                        ondragstart={handleElementDragStart}
                                        ondragend={handleDragEndClear}
                                        ondragover={handleElDragOver}
                                        ondragleave={handleDragLeave}
                                        ondrop={handleElementDrop}
                                    >
                                        <div class="bc-row-top">
                                            <button
                                                type="button"
                                                class="bc-select bc-row-label"
                                                data-id={el.id}
                                                data-kind="element"
                                                data-nav
                                                aria-pressed={el.pressed}
                                                aria-describedby="keyboard-help"
                                                onclick={handleElementClick}
                                                onkeydown={handleNavigationKey}
                                            >
                                                <template lwc:if={el.required}>
                                                    <abbr
                                                        class="bc-req"
                                                        title="required"
                                                        >*</abbr
                                                    >
                                                </template>
                                                <template lwc:if={el.isField}>
                                                    {el.label}
                                                </template>
                                                <template lwc:else>
                                                    <span class="bc-ctype"
                                                        >{el.typeLabel}</span
                                                    >
                                                </template>
                                            </button>
                                            <button
                                                type="button"
                                                class="bc-x"
                                                title="Remove"
                                                aria-label={el.removeLabel}
                                                data-id={el.id}
                                                onclick={handleRemoveElement}
                                            >
                                                ×
                                            </button>
                                        </div>
                                        <span
                                            class="bc-skeleton"
                                            aria-hidden="true"
                                        ></span>
                                    </div>
                                </template>
                                <template lwc:if={s.empty}>
                                    <div class="bc-drop-empty">
                                        {s.emptyText}
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <div
                class="bc-gap bc-gap-end"
                ondragover={handleGapDragOver}
                ondragleave={handleGapLeave}
                ondrop={handleGapDrop}
            ></div>

            <button
                type="button"
                class="bc-add-section"
                onclick={handleAddSection}
            >
                + Section
            </button>

            <template lwc:if={isEmpty}>
                <div class="bc-empty">
                    <ol>
                        <li>Pick fields from the palette</li>
                        <li>Arrange sections and pages</li>
                        <li>Switch to Design to style it</li>
                    </ol>
                </div>
            </template>
        </div>
    </div>
</template>
