<template>
    <div class="fu-root">
        <template lwc:if={preview}>
            <lightning-button
                label={addLabel}
                onclick={handlePreviewAdd}
            ></lightning-button>
            <input
                class="fu-input"
                type="file"
                aria-label={label}
                accept={accept}
                multiple={multiple}
                onchange={handlePreviewPick}
            />
            <p class="fu-help">{previewText}</p>
        </template>
        <!-- Upload Files straight away; disabled until a signed slot is ready.
             No uploader label: the question's label already sits above, and
             the group keeps that name for screen readers. -->
        <template lwc:if={showUploader}>
            <div role="group" aria-label={label}>
                <lightning-file-upload
                    accept={uploadAccept}
                    disabled={uploaderDisabled}
                    file-field-name={markerField}
                    file-field-value={slotToken}
                    onuploadfinished={handleFinished}
                ></lightning-file-upload>
            </div>
        </template>
        <p class="fu-help">{guidance}</p>
        <ul class="fu-list" aria-label={label}>
            <template for:each={rows} for:item="file">
                <li key={file.key} class="fu-row">
                    <span class="fu-name">{file.name}</span
                    ><span>{file.size}</span
                    ><span role="status">{file.status}</span>
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text={file.removeLabel}
                        title={file.removeLabel}
                        data-key={file.key}
                        disabled={busy}
                        onclick={handleRemove}
                    ></lightning-button-icon>
                </li>
            </template>
        </ul>
        <template lwc:if={showRetry}
            ><lightning-button
                label={checkLabel}
                disabled={busy}
                onclick={handleRetry}
            ></lightning-button
        ></template>
        <template lwc:if={error}
            ><p class="fu-error" role="alert">{error}</p></template
        >
    </div>
</template>
