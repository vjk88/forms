<template>
    <div
        class={layoutClass}
        onkeydown={handleKeydown}
        onfocusin={handleFocusIn}
        onadvancekey={handleAdvanceKey}
        onadvancefocus={handleAdvanceFocus}
    >
        <!-- OPEN PAGE: a progress strip across the top (shares the header's side
             inset), then one centered question column — no card. -->
        <template lwc:if={showTopChrome}>
            <div class="top-chrome">
                <div class="progress-hairline" aria-hidden="true">
                    <div class="progress-fill" style={progressFillStyle}></div>
                </div>
                <p class="counter">{counterText}</p>
            </div>
        </template>

        <!-- The question column on the open page; plain inside a card panel. -->
        <div class={bodyClass}>
            <template lwc:if={showInlineProgress}>
                <div class="progress">
                    <div class="progress-track" aria-hidden="true">
                        <div
                            class="progress-fill"
                            style={progressFillStyle}
                        ></div>
                    </div>
                    <p class="progress-text">{progressText}</p>
                </div>
            </template>

            <template for:each={currentScreenList} for:item="screen">
                <div class="screen-panel" key={screen.key} tabindex="-1">
                    <c-final-layout-zones
                        onvaluechange={handleValueChange}
                        sections={currentSections}
                        zones={currentZones}
                    ></c-final-layout-zones>
                </div>
            </template>

            <!-- One action row for every screen: Back + primary, placed by
                 arrangement. The primary is Continue while stepping, Submit on
                 the last screen — same spot, same style, no jump. The keyboard
                 hint rides with the primary, on the same row. -->
            <div class={actionRowClass}>
                <template lwc:if={showBackLink}>
                    <button
                        class="back-link"
                        type="button"
                        onclick={handleBack}
                    >
                        <lightning-icon
                            icon-name="utility:chevronleft"
                            size="xx-small"
                            aria-hidden="true"
                        ></lightning-icon>
                        {backButtonLabel}
                    </button>
                </template>
                <div class="advance">
                    <button
                        class="primary-btn"
                        type="button"
                        onclick={handlePrimary}
                        disabled={primaryDisabled}
                    >
                        {primaryLabel}
                    </button>
                    <template lwc:if={showHelperRow}>
                        <p class="key-helper">{keyboardHelperText}</p>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
