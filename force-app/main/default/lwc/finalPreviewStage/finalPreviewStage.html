<template>
    <div class="ps-bar">
        <div class="ps-frame">
            <c-final-button-group
                data-group="devices"
                label="Preview device"
                options={deviceOptions}
                value={device}
                onchange={handleDevice}
            ></c-final-button-group>
            <template lwc:if={isMobile}>
                <c-final-button-group
                    data-group="phones"
                    label="Phone width"
                    options={phoneOptions}
                    value={phone}
                    onchange={handlePhone}
                ></c-final-button-group>
            </template>
            <label class="ps-hostbox" title={hostHelp}>
                <span class="ps-swatch" aria-hidden="true"></span>
                <span class="ps-hostlabel">Page margin</span>
                <select
                    class="ps-host"
                    aria-describedby="ps-host-help"
                    onchange={handleHost}
                >
                    <template for:each={hostOptions} for:item="h">
                        <option key={h.key} value={h.key} selected={h.selected}>
                            {h.label}
                        </option>
                    </template>
                </select>
            </label>
            <span id="ps-host-help" class="ps-sr">{hostHelp}</span>
        </div>
        <div class="ps-tools">
            <c-final-button-group
                data-group="zooms"
                label="Preview zoom"
                options={zoomOptions}
                value={zoom}
                onchange={handleZoom}
            ></c-final-button-group>
            <span class="ps-scale" title="Current preview scale"
                >{scaleLabel}</span
            >
            <lightning-button-icon
                class="ps-pdf"
                icon-name="utility:download"
                variant="border-filled"
                alternative-text={pdfLabel}
                title={pdfLabel}
                disabled={pdfBusy}
                onclick={handleDownloadPdf}
            ></lightning-button-icon>
            <lightning-button-icon
                class="ps-refresh"
                icon-name="utility:refresh"
                variant="border-filled"
                alternative-text="Restart preview"
                title="Restart preview"
                onclick={handleRefresh}
            ></lightning-button-icon>
            <template lwc:if={expandable}>
                <lightning-button
                    class="ps-expand"
                    label={expandLabel}
                    aria-expanded={expandedAria}
                    onclick={handleExpand}
                ></lightning-button>
            </template>
        </div>
    </div>
    <template lwc:if={pdfError}>
        <p class="ps-pdf-error" role="alert">{pdfError}</p>
    </template>
    <div
        class="ps-viewport"
        tabindex="0"
        role="region"
        aria-label="Form preview; scroll horizontally at 100% zoom"
    >
        <div class="ps-surface">
            <div class="ps-canvas" style={canvasStyle}>
                <template for:each={frames} for:item="f">
                    <c-final-form-viewer
                        key={f.key}
                        preserve-preview={preserveSession}
                        preview-state={previewState}
                        onpreviewready={handlePreviewReady}
                        spec={spec}
                        record-context={recordContext}
                        authoring={authoring}
                        embedded
                        onelementselect={handleElementSelect}
                    ></c-final-form-viewer>
                </template>
            </div>
        </div>
    </div>
</template>
