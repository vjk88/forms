<template>
    <div class="ps-bar">
        <div class="ps-frame">
            <div class="ps-devices" role="group" aria-label="Preview device">
                <template for:each={deviceButtons} for:item="d">
                    <button
                        key={d.key}
                        type="button"
                        class={d.cls}
                        aria-pressed={d.pressed}
                        data-device={d.key}
                        onclick={handleDevice}
                    >
                        {d.label}
                    </button>
                </template>
            </div>
            <template lwc:if={isMobile}>
                <div class="ps-phones" role="group" aria-label="Phone width">
                    <template for:each={phoneButtons} for:item="p">
                        <button
                            key={p.key}
                            type="button"
                            class={p.cls}
                            aria-pressed={p.pressed}
                            data-phone={p.key}
                            title={p.title}
                            onclick={handlePhone}
                        >
                            {p.label}
                        </button>
                    </template>
                </div>
            </template>
            <label
                class="ps-hostbox"
                title="The page the form is shown on leaves its own margin around the form"
            >
                <span class="ps-hostlabel">Shown on</span>
                <select class="ps-host" onchange={handleHost}>
                    <template for:each={hostOptions} for:item="h">
                        <option key={h.key} value={h.key} selected={h.selected}>
                            {h.label}
                        </option>
                    </template>
                </select>
            </label>
        </div>
        <div class="ps-tools">
            <div class="ps-zooms" role="group" aria-label="Preview zoom">
                <template for:each={zoomButtons} for:item="z">
                    <button
                        key={z.key}
                        type="button"
                        class={z.cls}
                        aria-pressed={z.pressed}
                        data-zoom={z.key}
                        title={z.title}
                        onclick={handleZoom}
                    >
                        {z.label}
                    </button>
                </template>
            </div>
            <span class="ps-scale" title="Current preview scale"
                >{scaleLabel}</span
            >
            <button
                type="button"
                class="ps-refresh"
                title="Restart preview"
                aria-label="Restart preview"
                onclick={handleRefresh}
            >
                ⟳
            </button>
            <template lwc:if={expandable}>
                <button
                    type="button"
                    class="ps-expand"
                    aria-expanded={expandedAria}
                    onclick={handleExpand}
                >
                    {expandLabel}
                </button>
            </template>
        </div>
    </div>
    <div
        class="ps-viewport"
        tabindex="0"
        role="region"
        aria-label="Form preview; scroll horizontally at 100% zoom"
    >
        <div class="ps-surface">
            <div class="ps-canvas" style={canvasStyle}>
                <template for:each={frames} for:item="f">
                    <c-final-form-viewer
                        key={f.key}
                        preserve-preview={preserveSession}
                        preview-state={previewState}
                        onpreviewready={handlePreviewReady}
                        spec={spec}
                        record-context={recordContext}
                        authoring={authoring}
                        embedded
                        onelementselect={handleElementSelect}
                    ></c-final-form-viewer>
                </template>
            </div>
        </div>
    </div>
</template>
