<template>
    <div class="slds-box slds-theme_default" data-id="spike">
        <h2 class="slds-text-heading_small slds-m-bottom_small">
            Dependent lookup spike (slice 0)
        </h2>

        <lightning-record-picker
            data-id="account"
            label="Account"
            required
            object-api-name="Account"
            placeholder="Search accounts..."
            value={accountId}
            matching-info={matchingInfo}
            onchange={handleAccount}
            onerror={handleError}
        ></lightning-record-picker>

        <div class="slds-m-top_small">
            <template for:each={generations} for:item="g">
                <lightning-record-picker
                    key={g}
                    data-id="contact"
                    label="Contact"
                    object-api-name="Contact"
                    placeholder="Search contacts..."
                    value={contactId}
                    filter={contactFilter}
                    matching-info={matchingInfo}
                    display-info={displayInfo}
                    disabled={contactDisabled}
                    onchange={handleContact}
                    onerror={handleError}
                    onready={handleReady}
                ></lightning-record-picker>
            </template>
        </div>

        <div class="slds-m-top_small">
            <lightning-input
                type="checkbox"
                label="Remount + clear contact when account changes"
                data-id="remount"
                onchange={handleRemountToggle}
            ></lightning-input>
            <lightning-button
                label="Run validity probe"
                data-id="probe"
                onclick={handleProbe}
            ></lightning-button>
            <lightning-button
                label="Clear contact (no remount)"
                data-id="clearcontact"
                onclick={handleClearContact}
            ></lightning-button>
        </div>

        <p class="slds-m-top_small" data-id="readout">{readout}</p>
        <p data-id="filterjson">{filterJson}</p>
        <p data-id="log">{logText}</p>
    </div>
</template>
