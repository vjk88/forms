<template>
    <template lwc:if={action}>
        <div class="ma-head">
            <c-final-object-icon
                object-api={objectApi}
                size="large"
            ></c-final-object-icon>
            <div class="ma-head-text">
                <h2 class="ma-title" tabindex="-1">{objectLabel}</h2>
                <span class="ma-step">{stepText}</span>
            </div>
            <lightning-button-icon
                class="ma-remove"
                icon-name="utility:delete"
                variant="bare"
                alternative-text="Remove this record"
                disabled={readOnly}
                onclick={handleRemoveStep}
            ></lightning-button-icon>
        </div>

        <div class="ma-body">
            <p class="ma-summary">
                <lightning-icon
                    icon-name="utility:richtextbulletedlist"
                    size="x-small"
                ></lightning-icon>
                <span><strong>In plain words:</strong> {plainSummary}</span>
            </p>

            <section class="ma-branch">
                <h3 class="ma-subhead">What this record does</h3>
                <p class="ma-help">
                    Pick "Find or create" when the person may already be in
                    Salesforce, so you don't make duplicates.
                </p>
                <c-final-picture-choice
                    class="ma-operation"
                    label="What this record does"
                    options={operationTiles}
                    value={operation}
                    disabled={readOnly}
                    onchange={handleOperation}
                ></c-final-picture-choice>
            </section>

            <template lwc:if={isFindOrCreate}>
                <section class="ma-branch ma-match">
                    <h3 class="ma-subhead" tabindex="-1">
                        Find an existing {objectLabel} where
                    </h3>
                    <p class="ma-help">
                        Match on something unique, like an email or account
                        number. A name can match the wrong record.
                    </p>
                    <template for:each={filterKeys} for:item="k">
                        <c-final-lookup-filter
                            key={k.key}
                            target-object={objectApi}
                            value={filterConfig}
                            filter-only
                            answer-choices={filterAnswerChoices}
                            allow-typed
                            typed-value={typedFilter}
                            typed-context={typedContext}
                            onlookupconfigchange={handleFilter}
                        ></c-final-lookup-filter>
                    </template>
                    <template lwc:if={hasSearchNotes}>
                        <template for:each={searchNotes} for:item="n">
                            <p key={n.key} class="ma-why ma-search-note">
                                {n.text}
                            </p>
                        </template>
                    </template>
                </section>

                <section class="ma-branch">
                    <h3 class="ma-subhead" tabindex="-1">If one is found</h3>
                    <template lwc:if={matchUnanswered}>
                        <p class="ma-help ma-question">
                            When we find one, what should happen to it? Choose
                            one before you publish.
                        </p>
                    </template>
                    <template lwc:else>
                        <p class="ma-help">
                            Choose whether a match is only pointed at, or
                            changed by the answers.
                        </p>
                    </template>
                    <template lwc:if={isPublic}>
                        <div class="ma-notice" role="note">
                            <lightning-icon
                                icon-name="utility:warning"
                                variant="warning"
                                size="x-small"
                            ></lightning-icon>
                            <p>
                                <strong>This form is public.</strong> Anyone who
                                guesses a real value reaches whatever you allow
                                here, without signing in. "Use it, leave it
                                alone" is the safe choice.
                            </p>
                        </div>
                    </template>
                    <c-final-picture-choice
                        class="ma-on-match"
                        label="When we find one, what should happen to it?"
                        options={onMatchTiles}
                        value={onMatchValue}
                        disabled={readOnly}
                        onchange={handleOnMatch}
                    ></c-final-picture-choice>
                    <template lwc:if={showOverwrite}>
                        <p class="ma-help ma-match-summary">{matchSummary}</p>
                    </template>
                </section>
            </template>

            <section class="ma-branch">
                <h3 class="ma-subhead" tabindex="-1">{createHeading}</h3>
                <p class="ma-help">
                    Each field gets its value from an answer, or from a fixed
                    value you type.
                </p>
                <table class="ma-table">
                    <thead>
                        <tr>
                            <th scope="col" class="ma-th">
                                Field on {objectLabel}
                            </th>
                            <th scope="col" class="ma-th">
                                Gets its value from
                            </th>
                            <template lwc:if={showOverwrite}>
                                <th scope="col" class="ma-th ma-th--narrow">
                                    Also update when found
                                </th>
                            </template>
                            <th scope="col" class="ma-th ma-th--narrow">
                                <span class="slds-assistive-text">Remove</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="row">
                            <tr key={row.key} data-row={row.key} class="ma-row">
                                <td class="ma-td">
                                    <span class="ma-field">
                                        {row.label}
                                        <template lwc:if={row.required}>
                                            <span class="ma-required"
                                                >Required</span
                                            >
                                        </template>
                                    </span>
                                    <span class="ma-api">{row.key}</span>
                                </td>
                                <td class="ma-td">
                                    <lightning-combobox
                                        label="Source"
                                        variant="label-hidden"
                                        placeholder="Choose a source"
                                        data-field={row.key}
                                        options={row.options}
                                        value={row.value}
                                        disabled={readOnly}
                                        onchange={handleSource}
                                    ></lightning-combobox>
                                    <template lwc:if={row.isLiteral}>
                                        <lightning-input
                                            label="Fixed value"
                                            data-field={row.key}
                                            value={row.literal}
                                            disabled={readOnly}
                                            onchange={handleLiteral}
                                        ></lightning-input>
                                    </template>
                                    <template lwc:if={row.missing}>
                                        <p class="ma-why ma-error">
                                            {row.missing}
                                        </p>
                                    </template>
                                    <template lwc:if={row.why}>
                                        <p class="ma-why">{row.why}</p>
                                    </template>
                                </td>
                                <template lwc:if={showOverwrite}>
                                    <td class="ma-td">
                                        <template lwc:if={row.showTick}>
                                            <lightning-input
                                                type="checkbox"
                                                label="Also update when found"
                                                variant="label-hidden"
                                                data-overwrite
                                                data-field={row.key}
                                                checked={row.overwrite}
                                                disabled={readOnly}
                                                onchange={handleOverwrite}
                                            ></lightning-input>
                                        </template>
                                    </td>
                                </template>
                                <td class="ma-td">
                                    <lightning-button-icon
                                        icon-name="utility:close"
                                        variant="bare"
                                        alternative-text="Remove field"
                                        data-field={row.key}
                                        disabled={readOnly}
                                        onclick={handleRemoveField}
                                    ></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <lightning-combobox
                    class="ma-add-field"
                    label="Add a field"
                    placeholder="Choose a field"
                    options={unusedFieldOptions}
                    value={addingField}
                    disabled={readOnly}
                    onchange={handleAddField}
                ></lightning-combobox>
            </section>
        </div>
    </template>
</template>
