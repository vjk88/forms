<template>
    <template lwc:if={error}>
        <div class="viewer-error" role="alert">{error}</div>
    </template>
    <template lwc:elseif={model}>
        <c-final-page-frame
            tokens={tokens}
            max-width={model.maxWidth}
            bleed={model.bleed}
            embedded={embedded}
            onelementclick={handleElementClick}
        >
            <template lwc:if={model.header}>
                <c-final-form-header
                    slot="header"
                    header={model.header}
                ></c-final-form-header>
            </template>
            <div slot="body">
                <template lwc:if={completed}>
                    <c-final-after-submit
                        config={model.afterSubmit}
                        bleed={model.bleed}
                        oncontinue={handleAfterContinue}
                    ></c-final-after-submit>
                </template>
                <template lwc:elseif={navCtor}>
                    <template lwc:if={isEditLoading}>
                        <div class="viewer-loading" role="status">
                            <lightning-spinner
                                alternative-text="Loading record"
                                size="medium"
                            ></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:if={editError}>
                        <div class="viewer-submit-error" role="alert">
                            <p>{editError}</p>
                            <template lwc:if={canRetryEdit}>
                                <lightning-button
                                    label="Retry"
                                    onclick={handleEditRetry}
                                ></lightning-button>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={submitError}>
                        <div class="viewer-submit-error" role="alert">
                            {submitError}
                        </div>
                    </template>
                    <div hidden={isEditBlocked} data-edit-surface>
                        <lwc:component
                            lwc:is={navCtor}
                            pages={visiblePages}
                            current-page-index={pageIndex}
                            page-validity={pageValidity}
                            options={model.layoutOptions}
                            lockup={model.paneLockup}
                            arrangement={model.buttonArrangement}
                            bleed={model.bleed}
                            submit-label={effectiveSubmitLabel}
                            submit-disabled={isSubmitBlocked}
                            back-label={model.submit.backLabel}
                            onpagechange={handlePageChange}
                            onsubmit={handleSubmit}
                            onvaluechange={handleValueChange}
                            onadvanceblocked={handleAdvanceBlocked}
                        >
                            <!-- Slotted from the engine's template: button intents
                             never cross the primitive's shadow boundary. -->
                            <c-final-submit-bar
                                slot="actions"
                                config={effectiveSubmitConfig}
                                show-back={showBack}
                                show-next={showNext}
                                show-submit={showSubmit}
                                submitting={_submitting}
                                disabled={isSubmitBlocked}
                                arrangement={model.buttonArrangement}
                                onback={handleBack}
                                onnext={handleNext}
                                onsubmit={handleSubmit}
                            ></c-final-submit-bar>
                        </lwc:component>
                    </div>
                    <template for:each={_editReaders} for:item="reader">
                        <!-- Edit mode: read the record this form saves to, so
                             its current values fill the fields. Same reader the
                             Autofill rules use — it runs under the respondent's
                             own access, and omits fields they cannot read. -->
                        <c-final-autofill-record-source
                            key={reader.key}
                            rule-id="__edit__"
                            record-id={reader.recordId}
                            object-api-name={reader.objectApiName}
                            fields={reader.fields}
                            generation={reader.generation}
                            session-id={reader.sessionId}
                            onrecordsuccess={handleEditRecordLoad}
                            onrecorderror={handleEditRecordError}
                        ></c-final-autofill-record-source>
                    </template>
                    <template for:each={activeAutofillRequests} for:item="req">
                        <c-final-autofill-record-source
                            key={req.key}
                            rule-id={req.ruleId}
                            record-id={req.recordId}
                            object-api-name={req.objectApiName}
                            fields={req.fields}
                            generation={req.generation}
                            session-id={req.sessionId}
                            onrecordsuccess={handleAutofillRecordSuccess}
                            onrecorderror={handleAutofillRecordError}
                        ></c-final-autofill-record-source>
                    </template>
                </template>
            </div>
        </c-final-page-frame>
    </template>
    <template lwc:else>
        <div class="viewer-loading">
            <lightning-spinner
                alternative-text="Loading form"
                size="medium"
            ></lightning-spinner>
        </div>
    </template>
</template>
