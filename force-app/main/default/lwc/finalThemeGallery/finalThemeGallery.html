<template>
    <div class="gal">
        <div class="gal-controls">
            <div class="gal-layout" role="group" aria-label="Preview layout">
                <span class="gal-llabel">Preview in</span>
                <template for:each={layoutChips} for:item="l">
                    <button
                        key={l.value}
                        class={l.cls}
                        data-value={l.value}
                        onclick={handleLayout}
                        type="button"
                    >
                        {l.label}
                    </button>
                </template>
            </div>
            <p class="gal-hint">
                Dots show each look. Click a preview to use it.
            </p>
        </div>

        <div class="gal-grid">
            <template for:each={families} for:item="f">
                <div key={f.key} class="fam" data-family={f.key}>
                    <c-final-theme-card
                        theme-key={f.themeKey}
                        label={f.label}
                        description={f.description}
                        hide-swatches={f.many}
                        layout={previewLayout}
                        pane-flow={previewPaneFlow}
                        selected={f.selected}
                        onselect={handleSelect}
                    ></c-final-theme-card>
                    <template lwc:if={f.many}>
                        <!-- outside the card: a dot changes the preview only -->
                        <div
                            class="fam-dots"
                            role="radiogroup"
                            aria-label={f.groupLabel}
                        >
                            <template for:each={f.dots} for:item="d">
                                <button
                                    key={d.key}
                                    type="button"
                                    role="radio"
                                    class={d.cls}
                                    aria-checked={d.checked}
                                    aria-label={d.name}
                                    title={d.title}
                                    tabindex={d.tabindex}
                                    data-family={f.key}
                                    data-key={d.key}
                                    onclick={handleDot}
                                    onkeydown={handleDotKey}
                                >
                                    <span
                                        class="fam-chip"
                                        style={d.style}
                                    ></span>
                                </button>
                            </template>
                        </div>
                        <template lwc:if={f.yours}>
                            <p class="fam-yours">{f.yours}</p>
                        </template>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
