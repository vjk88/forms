<template>
    <lightning-card icon-name="standard:form" title="Answers">
        <template lwc:if={error}>
            <p class="sr-error slds-p-horizontal_medium" role="alert">
                {error}
            </p>
        </template>

        <template lwc:if={hasData}>
            <div class="slds-p-horizontal_medium sr-head">
                <p class="sr-form">{header.formName}</p>
                <p class="sr-meta">
                    {header.submissionNumber} · {header.submittedBy} ·
                    <lightning-formatted-date-time
                        value={header.submittedDate}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                    <template lwc:if={header.versionLabel}>
                        · {header.versionLabel}
                    </template>
                </p>
                <p class="sr-note">
                    Shown as this form asked it at the time — later edits to the
                    form do not change what is here.
                </p>
            </div>

            <template for:each={sections} for:item="section">
                <section key={section.key} class="sr-section">
                    <template lwc:if={section.title}>
                        <h3 class="sr-section-title">{section.title}</h3>
                    </template>
                    <dl class="sr-rows">
                        <template for:each={section.rows} for:item="row">
                            <div key={row.key} class="sr-row">
                                <dt class="sr-label">{row.label}</dt>
                                <dd class="sr-value">
                                    <!-- a matrix keeps its statements together,
                                         in the order the version asked them -->
                                    <template lwc:if={row.isMatrix}>
                                        <dl class="sr-matrix">
                                            <template
                                                for:each={row.lines}
                                                for:item="line"
                                            >
                                                <div
                                                    key={line.key}
                                                    class="sr-matrix-line"
                                                >
                                                    <dt class="sr-statement">
                                                        {line.label}
                                                    </dt>
                                                    <dd class="sr-value">
                                                        <template
                                                            lwc:if={line.answered}
                                                        >
                                                            <span
                                                                class="sr-answer"
                                                                >{line.value}</span
                                                            >
                                                            <template
                                                                lwc:if={line.unparsed}
                                                            >
                                                                <span
                                                                    class="sr-unparsed"
                                                                    >{line.note}</span
                                                                >
                                                            </template>
                                                        </template>
                                                        <template lwc:else>
                                                            <span
                                                                class="sr-skipped"
                                                                >{line.value}</span
                                                            >
                                                        </template>
                                                    </dd>
                                                </div>
                                            </template>
                                        </dl>
                                    </template>
                                    <template lwc:elseif={row.answered}>
                                        <template lwc:if={row.isEmail}>
                                            <lightning-formatted-email
                                                value={row.value}
                                                class="sr-answer"
                                            ></lightning-formatted-email>
                                        </template>
                                        <template lwc:elseif={row.isPhone}>
                                            <lightning-formatted-phone
                                                value={row.value}
                                                class="sr-answer"
                                            ></lightning-formatted-phone>
                                        </template>
                                        <template lwc:elseif={row.isUrl}>
                                            <lightning-formatted-url
                                                value={row.value}
                                                label={row.value}
                                                target="_blank"
                                                class="sr-answer"
                                            ></lightning-formatted-url>
                                        </template>
                                        <template lwc:else>
                                            <span class="sr-answer"
                                                >{row.value}</span
                                            >
                                        </template>
                                        <template lwc:if={row.unparsed}>
                                            <span class="sr-unparsed"
                                                >{row.note}</span
                                            >
                                        </template>
                                    </template>
                                    <template lwc:else>
                                        <span class="sr-skipped"
                                            >{row.value}</span
                                        >
                                    </template>
                                </dd>
                            </div>
                        </template>
                    </dl>
                </section>
            </template>

            <template lwc:if={hasFiles}>
                <section class="sr-section">
                    <h3 class="sr-section-title">Files</h3>
                    <ul class="sr-files">
                        <template for:each={files} for:item="file">
                            <li key={file.id} class="sr-file">
                                <lightning-icon
                                    icon-name="doctype:attachment"
                                    size="x-small"
                                ></lightning-icon>
                                <button
                                    class="sr-file-open"
                                    type="button"
                                    data-id={file.documentId}
                                    onclick={handleFileOpen}
                                >
                                    {file.title}
                                </button>
                                <template lwc:if={file.detail}>
                                    <span class="sr-file-detail"
                                        >{file.detail}</span
                                    >
                                </template>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>
        </template>
    </lightning-card>
</template>
