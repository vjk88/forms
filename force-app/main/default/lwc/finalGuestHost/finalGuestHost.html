<template>
    <div lwc:ref="root" class="guest-root">
        <template lwc:if={error}>
            <div class="guest-unavailable" role="alert">
                <p class="guest-unavailable__message">{error}</p>
            </div>
        </template>
        <template lwc:elseif={spec}>
            <template lwc:if={showHoneypot}>
                <!-- Honeypot: off-screen bait a real user never sees; a filled
                     value = a bot (server returns a fake success). -->
                <input
                    lwc:ref="honeypot"
                    class="hp-field"
                    type="text"
                    name="website"
                    tabindex="-1"
                    autocomplete="off"
                    aria-hidden="true"
                />
            </template>
            <!-- embedded: the guest form lives INSIDE the Experience site's
                 chrome, so the page frame must hug its content instead of
                 forcing a full 100vh (which left empty space below the form
                 and made the iframe too tall). -->
            <c-final-form-viewer
                lwc:ref="viewer"
                spec={spec}
                embedded
                delegate-submit
                onsubmitrequest={handleSubmitRequest}
            ></c-final-form-viewer>
        </template>
        <template lwc:else>
            <div class="guest-loading">
                <lightning-spinner
                    alternative-text="Loading form"
                    size="medium"
                ></lightning-spinner>
            </div>
        </template>
    </div>
</template>
