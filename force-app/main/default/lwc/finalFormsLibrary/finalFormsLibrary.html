<template>
    <div class="lib">
        <header class="lib-head">
            <div>
                <h2>Forms &amp; Surveys</h2>
                <p class="lib-subtitle">
                    Build, restore, and open configurations
                </p>
            </div>
            <div class="lib-actions">
                <span class="lib-filter-label" aria-hidden="true">Show</span>
                <lightning-combobox
                    class="lib-filter"
                    label="Form lifecycle filter"
                    variant="label-hidden"
                    options={statusOptions}
                    value={statusValue}
                    onchange={handleStatusFilter}
                ></lightning-combobox>
                <lightning-button
                    class="lib-refresh"
                    label="Refresh"
                    onclick={handleRefresh}
                ></lightning-button>
                <lightning-button
                    class="lib-new"
                    variant="brand"
                    icon-name="utility:add"
                    label="New form"
                    onclick={handleNew}
                ></lightning-button>
            </div>
        </header>
        <template lwc:if={restoreNotice}>
            <p class="lib-notice" role="status" aria-live="polite">
                {restoreNotice}
            </p>
        </template>
        <template lwc:if={error}>
            <p class="lib-error" role="alert">{error}</p>
        </template>
        <template lwc:elseif={empty}>
            <div class="lib-empty">
                <h3>{emptyTitle}</h3>
                <p>{emptyText}</p>
            </div>
        </template>
        <template lwc:elseif={rows}>
            <div class="lib-table-wrap">
                <table class="lib-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Object</th>
                            <th>Version</th>
                            <th>Last modified</th>
                            <th><span class="assistive-text">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={decoratedRows} for:item="row">
                            <tr key={row.id}>
                                <td class="lib-name">{row.name}</td>
                                <td>
                                    <span class="lib-type"
                                        >{row.typeLabel}</span
                                    >
                                </td>
                                <td>{row.objectLabel}</td>
                                <td>{row.versionLabel}</td>
                                <td>
                                    <lightning-formatted-date-time
                                        value={row.modified}
                                        year="numeric"
                                        month="short"
                                        day="numeric"
                                        hour="2-digit"
                                        minute="2-digit"
                                    ></lightning-formatted-date-time>
                                </td>
                                <td>
                                    <template lwc:if={row.isArchived}>
                                        <lightning-button
                                            class="lib-view"
                                            label="View"
                                            data-id={row.id}
                                            onclick={handleOpen}
                                        ></lightning-button>
                                        <lightning-button
                                            class="lib-restore"
                                            variant="brand"
                                            label={row.restoreLabel}
                                            data-id={row.id}
                                            disabled={row.restoring}
                                            title="Restore as a private draft"
                                            onclick={handleRestore}
                                        ></lightning-button>
                                    </template>
                                    <template lwc:else>
                                        <lightning-button
                                            class="lib-open"
                                            label="Open in Studio"
                                            data-id={row.id}
                                            onclick={handleOpen}
                                        ></lightning-button>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template lwc:else>
            <lightning-spinner
                alternative-text="Loading forms"
                size="small"
            ></lightning-spinner>
        </template>

        <template lwc:if={showGallery}>
            <div class="lib-overlay" role="dialog" aria-label="Create a form">
                <div class="lib-overlay-panel">
                    <c-final-creation-gallery
                        onformcreated={handleFormCreated}
                        onclose={handleGalleryClose}
                    ></c-final-creation-gallery>
                </div>
            </div>
        </template>
    </div>
</template>
