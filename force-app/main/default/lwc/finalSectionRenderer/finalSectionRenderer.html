<template>
    <div class={sectionClass} style={surfaceStyle}>
        <template lwc:if={hasHeader}>
            <header class={headClass}>
                <div class="sec-title-row">
                    <template lwc:if={headerIcon}>
                        <lightning-icon
                            class="sec-icon"
                            icon-name={headerIcon}
                            size="x-small"
                        ></lightning-icon>
                    </template>
                    <template lwc:if={sec.title}>
                        <h3 class="sec-title">{sec.title}</h3>
                    </template>
                    <template lwc:if={isCollapsible}>
                        <button
                            type="button"
                            class="sec-fold"
                            aria-expanded={toggleExpanded}
                            title="Expand or collapse this section"
                            onclick={handleToggleCollapse}
                        >
                            <lightning-icon
                                icon-name={chevronIcon}
                                size="x-small"
                            ></lightning-icon>
                        </button>
                    </template>
                </div>
                <template lwc:if={sec.description}>
                    <p class="sec-desc">{sec.description}</p>
                </template>
            </header>
        </template>
        <template lwc:if={showBody}>
            <template lwc:if={list}>
                <!-- A related list on a record page (Part 2, slice 1):
                     the record's existing children, read-only. -->
                <div class="rl" tabindex="-1">
                    <template lwc:if={list.loading}>
                        <p class="rl-status" role="status">
                            {list.loadingText}
                        </p>
                    </template>
                    <template lwc:elseif={list.failed}>
                        <div class="rl-failed" role="status">
                            <p class="rl-status">{list.errorText}</p>
                            <button
                                type="button"
                                class="rl-retry"
                                onclick={handleListRetry}
                            >
                                Try again
                            </button>
                        </div>
                    </template>
                    <template lwc:elseif={list.empty}>
                        <p class="rl-status">{list.emptyText}</p>
                    </template>
                    <template lwc:elseif={showTable}>
                        <div class="rl-table-wrap">
                            <table class="rl-table" aria-label={sec.title}>
                                <thead>
                                    <tr>
                                        <th scope="col">{list.nameLabel}</th>
                                        <template
                                            for:each={list.columns}
                                            for:item="col"
                                        >
                                            <th key={col.key} scope="col">
                                                {col.label}
                                            </th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template
                                        for:each={list.rows}
                                        for:item="row"
                                    >
                                        <tr key={row.id}>
                                            <th scope="row" class="rl-name">
                                                <template lwc:if={row.href}>
                                                    <a
                                                        href={row.href}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        >{row.name}<span
                                                            class="rl-sr"
                                                            >{newTabText}</span
                                                        ></a
                                                    >
                                                </template>
                                                <template lwc:else>
                                                    {row.name}
                                                </template>
                                            </th>
                                            <template
                                                for:each={row.cells}
                                                for:item="cell"
                                            >
                                                <td key={cell.key}>
                                                    {cell.value}
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="rep-entries">
                            <template for:each={list.rows} for:item="row">
                                <div
                                    key={row.id}
                                    class="rep-entry rl-card"
                                    role="group"
                                    aria-label={row.name}
                                >
                                    <div class="rep-entry-head">
                                        <span
                                            class="rep-entry-label rl-card-name"
                                            >{row.name}</span
                                        >
                                        <template lwc:if={row.href}>
                                            <a
                                                class="rl-open"
                                                href={row.href}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                >{list.openText}<span
                                                    class="rl-sr"
                                                    >{row.openSr}</span
                                                ></a
                                            >
                                        </template>
                                    </div>
                                    <dl class="rl-cells">
                                        <template
                                            for:each={row.cardCells}
                                            for:item="cell"
                                        >
                                            <div key={cell.key} class="rl-cell">
                                                <dt>{cell.label}</dt>
                                                <dd>
                                                    <template
                                                        lwc:if={cell.empty}
                                                    >
                                                        <span aria-hidden="true"
                                                            >—</span
                                                        >
                                                        <span class="rl-sr"
                                                            >No value</span
                                                        >
                                                    </template>
                                                    <template lwc:else>
                                                        {cell.value}
                                                    </template>
                                                </dd>
                                            </div>
                                        </template>
                                    </dl>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={list.moreText}>
                        <p class="rl-more">
                            {list.moreText}
                            <template lwc:if={list.viewAllHref}>
                                <a
                                    href={list.viewAllHref}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    >View all in Salesforce<span class="rl-sr"
                                        >{newTabText}</span
                                    ></a
                                >
                            </template>
                        </p>
                    </template>
                </div>
            </template>
            <template lwc:elseif={isRepeat}>
                <div class="rep-entries">
                    <template lwc:if={listNote}>
                        <p class="rl-status">{listNote}</p>
                    </template>
                    <template lwc:if={minMessage}>
                        <!-- polite: the "Fix N fields" line by the button is
                             the one alert of a blocked click -->
                        <p class="rep-min" role="status">{minMessage}</p>
                    </template>
                    <template lwc:if={showEntryTable}>
                        <div class="rl-table-wrap">
                            <table class="rl-table" aria-label={sec.title}>
                                <thead>
                                    <tr>
                                        <th scope="col">{entriesNameLabel}</th>
                                        <template
                                            for:each={tableQuestions}
                                            for:item="q"
                                        >
                                            <th key={q.id} scope="col">
                                                {q.label}
                                                <template lwc:if={q.isRequired}>
                                                    <abbr
                                                        class="field-req"
                                                        title="required"
                                                        aria-hidden="true"
                                                        >*</abbr
                                                    ><span class="rl-sr"
                                                        >{requiredSr}</span
                                                    >
                                                </template>
                                            </th>
                                        </template>
                                        <th scope="col" class={actCellClass}>
                                            <span class="rl-sr">Actions</span>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template
                                        for:each={repeatEntries}
                                        for:item="entry"
                                    >
                                        <tr
                                            key={entry.key}
                                            class={entry.rowClass}
                                        >
                                            <th scope="row" class="rl-name">
                                                <template lwc:if={entry.href}>
                                                    <a
                                                        class={entry.nameClass}
                                                        href={entry.href}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        >{entry.label}<span
                                                            class="rl-sr"
                                                            >{newTabText}</span
                                                        ></a
                                                    >
                                                </template>
                                                <template lwc:else>
                                                    <span
                                                        class={entry.nameClass}
                                                        >{entry.label}</span
                                                    >
                                                </template>

                                                <template
                                                    lwc:if={entry.viewOnly}
                                                >
                                                    <span class="rl-tag"
                                                        >View only<span
                                                            class="rl-sr"
                                                            >{entry.viewOnlySr}</span
                                                        ></span
                                                    >
                                                </template>
                                                <template
                                                    for:each={entry.rowErrors}
                                                    for:item="msg"
                                                >
                                                    <p
                                                        key={msg}
                                                        class="rep-min"
                                                        role="status"
                                                    >
                                                        {msg}
                                                    </p>
                                                </template>
                                            </th>
                                            <template
                                                for:each={entry.tableCells}
                                                for:item="cell"
                                            >
                                                <td key={cell.key}>
                                                    <template lwc:if={cell.el}>
                                                        <c-final-element-renderer
                                                            onvaluechange={handleValueChange}
                                                            element={cell.el}
                                                        ></c-final-element-renderer>
                                                    </template>
                                                </td>
                                            </template>
                                            <td class={actCellClass}>
                                                <template
                                                    lwc:if={entry.canDelete}
                                                >
                                                    <c-final-row-delete
                                                        name={entry.recordName}
                                                        noun={entry.noun}
                                                        row-key={entry.key}
                                                        marked={entry.deleted}
                                                        onrowdelete={handleRowDelete}
                                                    ></c-final-row-delete>
                                                </template>
                                                <template
                                                    lwc:if={entry.canRemove}
                                                >
                                                    <button
                                                        type="button"
                                                        class="rep-remove"
                                                        title={entry.removeLabel}
                                                        aria-label={entry.removeLabel}
                                                        data-key={entry.key}
                                                        onclick={handleRemoveEntry}
                                                    >
                                                        ×
                                                    </button>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template lwc:else>
                        <template for:each={repeatEntries} for:item="entry">
                            <div
                                key={entry.key}
                                class={entry.rowClass}
                                role="group"
                                aria-label={entry.label}
                            >
                                <div class="rep-entry-head">
                                    <span class={entry.nameClass}
                                        >{entry.label}</span
                                    >
                                    <template lwc:if={entry.viewOnly}>
                                        <span class="rl-tag"
                                            >View only<span class="rl-sr"
                                                >{entry.viewOnlySr}</span
                                            ></span
                                        >
                                    </template>
                                    <template lwc:if={entry.href}>
                                        <a
                                            class="rl-open"
                                            href={entry.href}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            >Open<span class="rl-sr"
                                                >{entry.openSr}</span
                                            ></a
                                        >
                                    </template>
                                    <template lwc:if={entry.canDelete}>
                                        <c-final-row-delete
                                            name={entry.recordName}
                                            noun={entry.noun}
                                            row-key={entry.key}
                                            marked={entry.deleted}
                                            onrowdelete={handleRowDelete}
                                        ></c-final-row-delete>
                                    </template>
                                    <template lwc:if={entry.canRemove}>
                                        <button
                                            type="button"
                                            class="rep-remove"
                                            title={entry.removeLabel}
                                            aria-label={entry.removeLabel}
                                            data-key={entry.key}
                                            onclick={handleRemoveEntry}
                                        >
                                            ×
                                        </button>
                                    </template>
                                </div>
                                <template
                                    for:each={entry.rowErrors}
                                    for:item="msg"
                                >
                                    <p key={msg} class="rep-min" role="status">
                                        {msg}
                                    </p>
                                </template>
                                <div class={gridClass}>
                                    <template
                                        for:each={entry.elements}
                                        for:item="g"
                                    >
                                        <c-final-element-renderer
                                            onvaluechange={handleValueChange}
                                            key={g.el.id}
                                            element={g.el}
                                            style={g.spanStyle}
                                        ></c-final-element-renderer>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template lwc:if={showAdd}>
                        <button
                            type="button"
                            class="rep-add"
                            onclick={handleAddEntry}
                        >
                            <span aria-hidden="true">+ </span>{addLabel}
                        </button>
                    </template>
                    <template lwc:if={listMore}>
                        <p class="rl-more">
                            {listMore}
                            <template lwc:if={listMoreHref}>
                                <a
                                    href={listMoreHref}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    >View all in Salesforce<span class="rl-sr"
                                        >{newTabText}</span
                                    ></a
                                >
                            </template>
                        </p>
                    </template>
                </div>
            </template>
            <template lwc:else>
                <div class={gridClass}>
                    <template for:each={gridElements} for:item="g">
                        <c-final-element-renderer
                            onvaluechange={handleValueChange}
                            key={g.el.id}
                            element={g.el}
                            data-el-id={g.el.id}
                            style={g.spanStyle}
                            onclick={handleElementClick}
                        ></c-final-element-renderer>
                    </template>
                </div>
            </template>
        </template>
    </div>
</template>
