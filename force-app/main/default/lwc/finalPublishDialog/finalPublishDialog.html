<template>
    <lightning-modal-header label={heading}></lightning-modal-header>

    <lightning-modal-body>
        <p class="pd-question">{question}</p>

        <template lwc:if={hasWarnings}>
            <ul class="pd-warnings">
                <template for:each={consequences} for:item="item">
                    <li key={item.key} class="pd-warning">
                        <lightning-icon
                            icon-name="utility:warning"
                            variant="warning"
                            size="x-small"
                            alternative-text="Warning"
                            class="pd-warning-icon"
                        ></lightning-icon>
                        <span class="pd-warning-text">{item.text}</span>
                    </li>
                </template>
            </ul>
        </template>

        <p class="pd-note">The live form updates immediately.</p>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}
            class="slds-m-right_x-small"
        ></lightning-button>
        <lightning-button
            label={confirmLabel}
            variant="brand"
            onclick={handlePublish}
        ></lightning-button>
    </lightning-modal-footer>
</template>
