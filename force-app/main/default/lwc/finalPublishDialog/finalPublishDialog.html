<template>
    <lightning-modal-header label={heading}></lightning-modal-header>

    <lightning-modal-body>
        <p class="pd-question">{question}</p>

        <template for:each={groups} for:item="g">
            <section key={g.key} class="pd-group">
                <template lwc:if={g.hasWhere}>
                    <div class="pd-group-head">
                        <span class="pd-where">
                            <span class="pd-area">{g.area}</span>
                            <span>{g.where}</span>
                        </span>
                        <template lwc:if={g.goTo}>
                            <lightning-button
                                variant="base"
                                label="Go there"
                                title={g.goLabel}
                                data-key={g.key}
                                onclick={handleGo}
                            ></lightning-button>
                        </template>
                    </div>
                </template>
                <template lwc:if={g.lead}>
                    <p class="pd-lead">{g.lead}</p>
                </template>
                <ul class="pd-lines">
                    <template for:each={g.lines} for:item="l">
                        <li key={l.key} class={l.cls}>
                            <lightning-icon
                                icon-name={l.icon}
                                variant={l.variant}
                                size="x-small"
                                alternative-text={l.alt}
                                class="pd-line-icon"
                            ></lightning-icon>
                            <span class="pd-line-text">
                                <template lwc:if={l.section}>
                                    <span class="pd-section">{l.section}</span>
                                </template>
                                <span>{l.text}</span>
                            </span>
                        </li>
                    </template>
                </ul>
            </section>
        </template>

        <template lwc:if={showLiveNote}>
            <p class="pd-note">The live form updates immediately.</p>
        </template>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}
            class="slds-m-right_x-small"
        ></lightning-button>
        <lightning-button
            label={confirmLabel}
            variant="brand"
            disabled={hasBlockers}
            onclick={handlePublish}
        ></lightning-button>
    </lightning-modal-footer>
</template>
