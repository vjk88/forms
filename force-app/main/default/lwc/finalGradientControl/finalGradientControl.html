<template>
    <div class="row">
        <template lwc:if={edited}>
            <span class="dot" title="Customized"></span>
        </template>
        <span class="label">{label}</span>
        <c-final-button-group
            class="seg"
            label={modeGroupLabel}
            options={modeOptions}
            value={modeValue}
            disabled={disabled}
            onchange={handleMode}
        ></c-final-button-group>
    </div>

    <template lwc:if={isGradient}>
        <div class="gbody">
            <div class="presets">
                <template for:each={presets} for:item="p">
                    <button
                        key={p.key}
                        class="preset"
                        type="button"
                        style={p.style}
                        data-start={p.start}
                        data-end={p.end}
                        title={p.name}
                        aria-label={p.name}
                        disabled={disabled}
                        onclick={handlePreset}
                    ></button>
                </template>
            </div>
            <div class="grow">
                <label>Type</label>
                <lightning-combobox
                    class="g-type"
                    label={typeLabel}
                    variant="label-hidden"
                    options={typeOptions}
                    value={typeValue}
                    disabled={disabled}
                    onchange={handleType}
                ></lightning-combobox>
            </div>
            <template lwc:if={isLinear}>
                <div class="grow">
                    <label>Angle</label>
                    <lightning-slider
                        class="g-angle"
                        label={angleLabel}
                        variant="label-hidden"
                        disabled={disabled}
                        min="0"
                        max="360"
                        value={angle}
                        onchange={handleAngle}
                    ></lightning-slider>
                    <span class="deg">{angle}°</span>
                </div>
            </template>
            <div class="grow">
                <label>Start</label>
                <input
                    type="color"
                    aria-label={startLabel}
                    value={start}
                    disabled={disabled}
                    oninput={handleStart}
                />
                <label class="end-label">End</label>
                <input
                    type="color"
                    aria-label={endLabel}
                    value={end}
                    disabled={disabled}
                    oninput={handleEnd}
                />
            </div>
        </div>
    </template>
    <template lwc:else>
        <div class="grow solid-row">
            <span class="hex">{solid}</span>
            <input
                type="color"
                aria-label={solidLabel}
                value={solid}
                disabled={disabled}
                oninput={handleSolidColor}
            />
        </div>
    </template>
</template>
