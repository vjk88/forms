<template>
    <div class="flow">
        <template for:each={pageList} for:item="page">
            <section class="page-block" key={page.key}>
                <template lwc:if={showPageDividers}>
                    <template lwc:if={page.named}>
                        <h2 class="divider">{page.name}</h2>
                    </template>
                    <template lwc:else>
                        <h2 class={page.quietClass}>
                            <span class="divider-name">{page.name}</span>
                        </h2>
                    </template>
                </template>
                <c-final-layout-zones
                    class={page.zonesClass}
                    onvaluechange={handleValueChange}
                    sections={page.sections}
                    zones={page.zones}
                ></c-final-layout-zones>
            </section>
        </template>
        <slot name="actions"></slot>
    </div>
</template>
